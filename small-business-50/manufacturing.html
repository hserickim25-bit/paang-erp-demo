<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ERP Small Business-50 read-only demo — developed by Paang Corporation (mobile 0905 356 3644)">
<title>ERP Small Business-50 Demo</title>
<style>
[hidden]{display:none!important}
/* ERP Small Business-50 — owner-friendly, phone-first. Same family as ERP Enterprise-500 (ledger green), larger touch targets. */
:root {
  --paper: #F3F6F1; --sheet: #FFFFFF; --ink: #1E2A2E; --ink-2: #4C5A5F; --ink-3: #7E8A8D;
  --green: #2E6A4F; --green-2: #3B7F60; --green-wash: #E2EEE6; --rule: #CFDCE3; --rule-soft: #E6EDF1;
  --red: #B23A30; --red-wash: #F8E4E1; --amber: #9A6510; --amber-wash: #F7EBD3; --blue: #2F5E86; --blue-wash: #E1EBF4;
  --side: #E6EDE4; --r: 8px;
  --font: "Segoe UI", "SF Pro Text", system-ui, -apple-system, "Noto Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 15px/1.5 var(--font); color: var(--ink); background: var(--paper); font-variant-numeric: tabular-nums; }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
h1 { font-size: 23px; margin: 0 0 4px; letter-spacing: -.3px; text-wrap: balance; }
h2 { font-size: 17px; margin: 24px 0 10px; }
.sub { color: var(--ink-2); margin: 0 0 16px; max-width: 70ch; }

/* shell */
.shell { display: grid; grid-template-columns: 236px 1fr; height: 100vh; }
.side { background: var(--side); border-right: 1px solid #D2DCD0; overflow-y: auto; padding: 14px 10px 30px; }
.brand { padding: 4px 10px 12px; margin-bottom: 8px; border-bottom: 2px solid var(--green); }
.brand b { display: block; font-size: 16.5px; color: var(--green); line-height: 1.25; }
.brand span { font-size: 12px; color: var(--ink-2); }
.side h4 { margin: 14px 10px 4px; font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.side a { display: block; padding: 7px 10px; border-radius: var(--r); color: var(--ink-2); text-decoration: none; border-left: 3px solid transparent; }
.side a:hover { background: #DAE4D8; color: var(--ink); }
.side a.on { background: var(--sheet); color: var(--green); border-left-color: var(--green); font-weight: 600; }
.main { overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
.top { display: flex; gap: 8px; align-items: center; padding: 10px 22px; background: var(--sheet); border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 5; }
.top .t { flex: 1; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .who { color: var(--ink-2); font-size: 13px; }
.menu-btn { display: none; }
.page { padding: 20px 22px 40px; max-width: 1240px; width: 100%; flex: 1 0 auto; }
.foot { padding: 14px 22px 18px; border-top: 1px solid var(--rule); background: var(--sheet); }
.dev { font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.dev b, .dev .tel { color: var(--ink-2); }
.dev .tel { white-space: nowrap; user-select: all; }
.tabbar { display: none; }

/* buttons & fields */
.btn { border: 1px solid #B7C6BC; background: var(--sheet); padding: 8px 14px; border-radius: var(--r); cursor: pointer; white-space: nowrap; min-height: 40px; }
.btn:hover { border-color: var(--green); }
.btn.pri { background: var(--green); border-color: var(--green); color: #fff; }
.btn.pri:hover { background: var(--green-2); }
.btn.warn { color: var(--red); border-color: #E3B5AF; }
.btn.sm { padding: 4px 10px; min-height: 32px; font-size: 13.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin: 0 0 12px; }
.bar .grow { flex: 1; }
input, select, textarea { border: 1px solid #BFCBC4; border-radius: var(--r); padding: 8px 10px; background: #fff; min-width: 0; min-height: 40px; }
textarea { min-height: 70px; width: 100%; resize: vertical; }
input[type=checkbox] { width: 20px; height: 20px; min-height: 0; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); }
label.f > input, label.f > select, label.f > textarea { font-size: 15px; color: var(--ink); }
label.f small { color: var(--ink-3); font-size: 12px; }
label.chk { display: flex; gap: 10px; align-items: center; font-size: 15px; padding-top: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 14px; }
.grid .wide { grid-column: 1 / -1; }
.req::after { content: " *"; color: var(--red); }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; }
.card + .card { margin-top: 14px; }
.card h3 { margin: 0 0 10px; font-size: 15.5px; }
.seg { display: inline-flex; border: 1px solid #B7C6BC; border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 8px 14px; cursor: pointer; min-height: 40px; }
.seg button.on { background: var(--green); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid #C2CEC6; background: var(--sheet); border-radius: 18px; padding: 7px 13px; cursor: pointer; }
.chips button.on { background: var(--green-wash); border-color: var(--green); color: var(--green); font-weight: 600; }

/* home */
.hello { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin-bottom: 14px; }
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.actions a { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: var(--r); background: var(--green); color: #fff; text-decoration: none; }
.actions a:nth-child(n+2) { background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); }
.actions a b { font-size: 16px; }
.actions a span { font-size: 12.5px; opacity: .8; }
.actions a:hover { filter: brightness(.97); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.tile { padding: 13px 16px; border-right: 1px solid var(--rule-soft); border-bottom: 1px solid var(--rule-soft); }
.tile .v { font-size: 22px; font-weight: 650; letter-spacing: -.3px; }
.tile .k { font-size: 13px; color: var(--ink-2); }
.tile.bad .v { color: var(--red); }
.cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; margin-top: 14px; }
.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--rule-soft); }
.todo li:last-child { border-bottom: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--amber); }
.dot.red { background: var(--red); } .dot.green { background: var(--green); } .dot.blue { background: var(--blue); }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
svg.chart { width: 100%; height: auto; display: block; }

/* tables */
.tw { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th { text-align: left; font-weight: 600; color: var(--ink-2); background: #F6F8F5; padding: 9px 10px; border-bottom: 2px solid var(--green); white-space: nowrap; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--rule-soft); white-space: nowrap; }
table.t td.wrap { white-space: normal; min-width: 180px; }
table.t .n { text-align: right; }
table.t tbody tr.click { cursor: pointer; }
table.t tbody tr.click:hover td { background: var(--green-wash); }
table.t tfoot td { font-weight: 700; border-top: 1px solid var(--ink); border-bottom: 0; background: #F6F8F5; }
table.t td input { width: 86px; min-height: 34px; padding: 4px 6px; text-align: right; }
table.t tr.total td { font-weight: 700; border-top: 1px solid var(--ink); }
table.t tr.sec td { font-weight: 600; color: var(--green); background: #F6F8F5; }
.empty { padding: 30px 16px; text-align: center; color: var(--ink-2); }
.neg { color: var(--red); }
.muted { color: var(--ink-3); }
.pill { display: inline-block; padding: 1px 9px; border-radius: 11px; font-size: 12.5px; background: var(--rule-soft); color: var(--ink-2); }
.pill.Paid, .pill.Active, .pill.ok { background: var(--green-wash); color: var(--green); }
.pill.Unpaid, .pill.Void, .pill.Resigned, .pill.Terminated, .pill.late { background: var(--red-wash); color: var(--red); }
.pill.Partial, .pill.Draft, .pill.low, .pill.Open { background: var(--amber-wash); color: var(--amber); }
.pill.Final { background: var(--blue-wash); color: var(--blue); }

/* sale/purchase entry */
.lines { display: flex; flex-direction: column; gap: 8px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) 90px 110px 110px 36px; gap: 8px; align-items: center; }
.line .amt { text-align: right; font-weight: 600; }
.line .x { border: 0; background: none; font-size: 22px; color: var(--ink-3); cursor: pointer; }
.totalbox { display: flex; justify-content: flex-end; gap: 22px; align-items: baseline; padding: 12px 4px 0; flex-wrap: wrap; }
.totalbox .big { font-size: 26px; font-weight: 700; color: var(--green); }
.note { background: var(--amber-wash); border: 1px solid #E7D09F; padding: 10px 12px; border-radius: var(--r); margin: 0 0 12px; color: #5c4512; }
.ok-note { background: var(--green-wash); border: 1px solid #BFD6C6; padding: 10px 12px; border-radius: var(--r); margin: 0 0 12px; }
details.adv { margin-top: 14px; }
details.adv summary { cursor: pointer; color: var(--blue); }

/* report */
.report .summary { font-size: 17px; line-height: 1.55; max-width: 70ch; }
.report .summary b { color: var(--green); }
.report .summary b.neg { color: var(--red); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* modal & toast */
.ov { position: fixed; inset: 0; background: rgba(30, 42, 46, .45); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 12px; z-index: 50; overflow-y: auto; }
.modal { background: var(--paper); border-radius: 10px; width: min(760px, 100%); box-shadow: 0 18px 50px rgba(20, 30, 30, .3); }
.modal.sm { width: min(460px, 100%); }
.modal header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--sheet); border-bottom: 1px solid var(--rule); border-radius: 10px 10px 0 0; }
.modal .body { padding: 16px 18px; max-height: 74vh; overflow-y: auto; }
.modal footer { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 12px 18px; background: var(--sheet); border-top: 1px solid var(--rule); border-radius: 0 0 10px 10px; }
.x-btn { border: 0; background: none; font-size: 24px; line-height: 1; cursor: pointer; color: var(--ink-2); }
.toast { position: fixed; right: 16px; bottom: 16px; z-index: 99; display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
.toast div { background: var(--ink); color: #fff; padding: 11px 15px; border-radius: var(--r); box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
.toast div.err { background: var(--red); }

/* sign-in */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 18px; }
.auth .card { width: min(440px, 100%); border-top: 4px solid var(--green); padding: 24px; }
.auth h1 { color: var(--green); }
.auth .grid { grid-template-columns: 1fr; }
.auth .dev { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule-soft); text-align: center; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; color: var(--green); border: 1px solid var(--green); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; height: 100%; }
  .side { position: fixed; inset: 0 22% 0 0; z-index: 40; transform: translateX(-105%); transition: transform .2s; box-shadow: 4px 0 30px rgba(0,0,0,.2); }
  .side.open { transform: none; }
  .menu-btn { display: inline-flex; }
  .top { padding: 8px 12px; }
  .top .who { display: none; }
  .page { padding: 14px 14px 90px; }
  .foot { padding: 12px 14px 80px; }
  .cols, .two { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .tile .v { font-size: 18px; }
  .line { grid-template-columns: 1fr 70px 90px; }
  .line .amt { grid-column: 1 / 3; text-align: left; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--sheet); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabbar a { text-align: center; padding: 9px 2px 10px; font-size: 12.5px; color: var(--ink-2); text-decoration: none; }
  .tabbar a b { display: block; font-size: 18px; line-height: 1.1; color: var(--green); }
  .toast { bottom: 76px; left: 12px; right: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print { .side, .top, .tabbar, .foot, .no-print { display: none !important; } }

a.btn { text-decoration: none; }
@media (max-width: 600px) {
  .top #pwBtn, .top .who { display: none; }
  .lines .line { grid-template-columns: 1fr 1fr auto 28px; }
  .lines .line select { grid-column: 1 / -1; }
  .lines .line .amt { grid-column: auto; text-align: right; }
  .side .mob-only { display: block; }
}
.side .mob-only { display: none; }
.t.pay th:first-child, .t.pay td:first-child { position: sticky; left: 0; background: var(--sheet); z-index: 1; min-width: 170px; }
.t.pay input { width: 78px; text-align: right; }
.t.pay input[data-adv] { width: 96px; }
.scan input { width: 100%; font-size: 17px; padding: 12px 14px; margin-bottom: 10px; border: 2px dashed var(--green); border-radius: var(--r); background: var(--sheet); }
.scbox { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule-soft); }
.biz { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.biz button { text-align: left; padding: 14px; border: 1.5px solid var(--rule); border-radius: var(--r); background: var(--sheet); cursor: pointer; font: inherit; color: inherit; }
.biz button b { display: block; font-size: 16px; margin: 4px 0; }
.biz button span { font-size: 12.5px; color: var(--ink-2); }
.biz button i { font-style: normal; font-size: 22px; }
.biz button.on { border-color: var(--green); background: var(--green-wash); box-shadow: inset 0 0 0 1px var(--green); }
.feats { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 14px; margin-top: 12px; }
.feats label small { display: block; color: var(--ink-3); font-size: 12px; margin-left: 24px; }
.pos { color: var(--green); }
/* HR documents dialog */
.hrd-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.hrd-tabs button { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); padding: 7px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
.hrd-tabs button.on { background: var(--green, #2E6A4F); border-color: var(--green, #2E6A4F); color: #fff; }
.hrd-opts { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; margin-bottom: 10px; }
.hrd-opts label.f { min-width: 220px; flex: 1 1 220px; }
.hrd-opts label.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; padding-bottom: 8px; }
.hrd-opts [hidden], .hrd-opts label[hidden] { display: none !important; }
.hrd-pv { border: 1px solid var(--rule); border-radius: var(--r); max-height: 62vh; overflow: auto; background: #fff; }
.hrd-size { font-size: 12px; color: #4a5a50; background: #eef3ee; padding: 6px 10px; border-bottom: 1px solid var(--rule); }
.hr-logo { display: flex; gap: 16px; align-items: center; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; margin: 0 0 16px; }
.hr-logo .lh-logo-pv { width: 150px; height: 70px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px dashed var(--rule); border-radius: var(--r); flex: none; }
.hr-logo .lh-logo-pv img { max-width: 140px; max-height: 62px; object-fit: contain; }
@media (max-width: 600px) { .hr-logo { flex-direction: column; align-items: flex-start; } }
.lic-f { display: grid; gap: 12px; }
.lic-f input { letter-spacing: .5px; }
/* payment terms & post-dated checks */
.modal.lg { width: min(1040px, 100%); }
.pt-tw { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
table.pt-t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.pt-t th { text-align: left; font-weight: 600; background: #F6F8F5; padding: 8px 9px; border-bottom: 2px solid var(--green); white-space: nowrap; }
table.pt-t td { padding: 7px 9px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; white-space: nowrap; }
table.pt-t .n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.pt-t tfoot td { font-weight: 600; background: #F6F8F5; border-bottom: 0; }
table.pt-t tr.click { cursor: pointer; } table.pt-t tr.click:hover td { background: var(--green-wash); }
table.pt-t tr.pt-due td { background: #FFF7E6; }
table.pt-t input, table.pt-t select { font: inherit; font-size: 13.5px; padding: 5px 7px; border: 1px solid var(--rule); border-radius: 6px; background: #fff; min-width: 0; max-width: 100%; }
table.pt-ed td:nth-child(3) input { width: 100%; min-width: 150px; }
.pt-duebox { display: flex; gap: 6px; align-items: center; } .pt-duebox input[name=condition] { min-width: 170px; }
.pt-act { white-space: nowrap; } .pt-act .btn { margin: 0 4px 4px 0; padding: 5px 10px; font-size: 13px; }
.ptp { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #EEF1EC; color: #3d4a42; white-space: nowrap; }
.ptp.ok { background: #E1F1E6; color: #1d5e3a; } .ptp.mid { background: #E6EEF8; color: #234f86; } .ptp.warn { background: #FFF1D6; color: #7a5300; }
.ptp.bad { background: #FBE3E0; color: #9b2c22; } .ptp.cond { background: #F0EAF7; color: #5a3d86; }
.pt-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
.pt-head div { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 8px 10px; }
.pt-head span { display: block; font-size: 12px; color: #5b6a60; } .pt-head b { font-size: 16px; font-variant-numeric: tabular-nums; }
.pt-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 12px 0; }
.pt-tiles button { text-align: left; font: inherit; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; cursor: pointer; color: inherit; }
.pt-tiles button.on { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); } .pt-tiles button.bad b { color: #9b2c22; }
.pt-tiles span { display: block; font-size: 12.5px; color: #5b6a60; } .pt-tiles b { display: block; font-size: 19px; margin: 2px 0; font-variant-numeric: tabular-nums; } .pt-tiles small { color: #6b7a70; }
.pt-pre { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; margin-bottom: 12px; }
.pt-pre .grid { margin: 8px 0; } .pt-chk { display: contents; } .pt-chk[hidden] { display: none; } .pt-ser { display: contents; }
.hrd-tabs .btn.pri { border-radius: var(--r); }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); display: flex; flex-direction: column; }
#app { flex: 1; min-height: 0; }
.shell { height: 100%; }
.demo-bar { background: var(--green); color: #fff; font-size: 12.5px; padding: 8px 16px; line-height: 1.3; }
.demo-bar span { opacity: .9; }
.demo-bar a { color: #fff; text-decoration: underline; }
</style>
</head>

<script>
window.DEMO = true; window.ERP_DEFAULT_LANG = "ko";
(function () {
  const S = window.__SNAP;
  const ok = (o) => Promise.resolve(new Response(JSON.stringify(o), { status: 200, headers: { "Content-Type": "application/json" } }));
  const bad = (m, st) => Promise.resolve(new Response(JSON.stringify({ error: m }), { status: st || 400, headers: { "Content-Type": "application/json" } }));
  const RO = "This is a read-only demo — nothing is saved. Install ERP Small Business-50 to enter your own records. / 읽기 전용 데모입니다. 실제 입력·저장은 설치 버전에서 가능합니다.";
  const NA = "Not included in the demo — available in the installed version. / 데모에는 포함되지 않은 화면입니다 (설치 버전에서 사용 가능).";
  const keyOf = (path, q) => path + (Object.keys(q).length ? "?" + Object.keys(q).sort().map((k) => k + "=" + q[k]).join("&") : "");
  const realFetch = window.fetch.bind(window);
  window.fetch = function (url, opt) {
    url = String(url);
    if (!url.startsWith("/api/")) return realFetch(url, opt);
    const u = new URL(url, "http://demo");
    const path = u.pathname.slice(5);
    const q = Object.fromEntries(u.searchParams);
    if (opt && opt.method === "POST") {
      if (["login", "logout", "act/lang"].includes(path)) return ok({ ok: 1, message: "ok" });
      return bad(RO);
    }
    if (path === "report/pdc_list" && S["report/pdc_list"]) {
      const d = JSON.parse(JSON.stringify(S["report/pdc_list"])), t = new Date(); t.setMinutes(t.getMinutes() - t.getTimezoneOffset());
      const wk = new Date(t.getTime() + 7 * 864e5).toISOString().slice(0, 10);
      d.rows = d.rows.filter((r) => !q.status || (q.status === "due" ? r.status === "On hand" && r.check_date <= wk : r.status === q.status));
      return ok(d);
    }
    if (path === "report/collection_schedule") return ok(S["report/collection_schedule?days=30"]);
    if (path === "report/hrdoc") { const d = S[`report/hrdoc?id=${q.id}&type=${q.type}`]; return d ? ok(d) : bad(NA); }
    if (path === "report/recipe") {            // scale the one-unit recipe to the quantity typed
      const base = S["report/recipe?product_id=" + q.product_id];
      if (!base) return ok(null);
      const n = +(q.qty || 1), d = JSON.parse(JSON.stringify(base));
      d.lines.forEach((l) => { l.need = Math.round(l.need * n * 1e4) / 1e4; l.cost = Math.round(l.cost * n * 100) / 100; });
      d.total = Math.round(d.lines.reduce((s, l) => s + l.cost, 0) * 100) / 100;
      return ok(d);
    }
    if (path === "report/plan") {               // production plan from recipe + product snapshots
      const items = JSON.parse(q.items || "[]"), prods = S["list/products"] || [], need = {}, made = [];
      items.forEach((it) => { const base = S["report/recipe?product_id=" + it.product_id], pr = prods.find((p) => p.id === it.product_id) || {};
        if (!base) { made.push({ product: pr.name, qty: it.qty, note: "No recipe yet" }); return; }
        let mc = 0; base.lines.forEach((l) => { const n = l.need * it.qty; mc += l.cost * it.qty; const m = need[l.material_id] || (need[l.material_id] = { material_id: l.material_id, name: l.name, unit: l.unit, need: 0 }); m.need = Math.round((m.need + n) * 1e4) / 1e4; });
        made.push({ product: pr.name, qty: it.qty, unit: pr.unit, material_cost: Math.round(mc * 100) / 100 }); });
      const mats = Object.values(need).map((m) => { const p = prods.find((x) => x.id === m.material_id) || {}; const oh = p.on_hand || 0, short = Math.max(0, Math.round((m.need - oh) * 1e4) / 1e4), buy = short ? short + (p.reorder_level || 0) : 0;
        return { ...m, on_hand: oh, short, buy, cost: p.cost || 0, buy_cost: Math.round(buy * (p.cost || 0) * 100) / 100 }; }).sort((a, b) => b.short - a.short || a.name.localeCompare(b.name));
      return ok({ products: made, materials: mats, short_count: mats.filter((m) => m.short > 0).length, buy_cost: Math.round(mats.reduce((t, m) => t + m.buy_cost, 0) * 100) / 100 });
    }
    const k = keyOf(path, q);
    if (path === "report/sale" && S[k]) return ok(Object.assign({ company: S["report/company"] }, S[k]));
    if (S[k] !== undefined) return ok(S[k]);
    if (S[path] !== undefined && !Object.keys(q).length) return ok(S[path]);
    if (["report/sales", "report/expenses", "report/purchases", "report/waste"].includes(path)) return ok([]);
    return bad(NA, 404);
  };
})();
</script>
<script>/* ERP Small Business-50 — single-page client for small-business owners. No external libraries. */
"use strict";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const LS = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } } };
let LANG = LS.get("lite_lang") || window.ERP_DEFAULT_LANG || "en";
const L = (s) => { const p = String(s == null ? "" : s).split("|"); return LANG === "ko" && p.length > 1 ? p[1] : p[0]; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const thisMonth = () => today().slice(0, 7);
const n2 = (v) => Number(v || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (v) => { if (v == null || v === "") return ""; const x = Number(v); return x < -0.004 ? `<span class="neg">-₱${n2(-x)}</span>` : "₱" + n2(x); };
const peso0 = (v) => (Number(v) < 0 ? "-₱" : "₱") + Math.abs(Math.round(Number(v || 0))).toLocaleString("en-PH");
const qty = (v) => Number(v || 0).toLocaleString("en-PH", { maximumFractionDigits: 3 });
const monthName = (ym) => new Date(ym + "-01T00:00").toLocaleDateString(LANG === "ko" ? "ko-KR" : "en-PH", { year: "numeric", month: "long" });

const DEVELOPER = Object.freeze({ name: "Paang Corporation", mobile: "0905 356 3644" });
const devHTML = () => `<div class="dev">ERP Small Business-50 — ${L("Developed by|개발사")} <b>${DEVELOPER.name}</b> · ${L("Mobile|휴대폰")} <span class="tel">${DEVELOPER.mobile}</span></div>`;

const CACHE = {};
const can = (a, w) => !!(AREAS[a] && AREAS[a][w ? "w" : "r"]);
const STATUS = { Open: "Paying back|상환중", Cancelled: "Cancelled|취소", Paid: "Paid|완료", Unpaid: "Unpaid|미수", Partial: "Part paid|일부", Void: "Cancelled|취소", Draft: "Draft|작성중", Final: "Final|확정", Active: "Active|재직", Resigned: "Resigned|퇴사", Terminated: "Terminated|해고", "On Leave": "On leave|휴직", Inactive: "Inactive|비활성" };

async function api(path, data) {

function barChart(data, keys, colors, H = 210) {
  const W = 620, p = { l: 52, r: 10, t: 10, b: 26 }, n = data.length, gw = (W - p.l - p.r) / n, bw = Math.min(26, (gw - 10) / keys.length);

function lineEditor(root, products, priceKey) {
  const box = $(".lines", root);
  const opts = `<option value="">${L("Choose item…|품목 선택…")}</option>` + products.filter((p) => p.active && (priceKey !== "cost" ? p.kind !== "material" : !["service", "menu"].includes(p.kind))).map((p) => `<option value="${p.id}">${esc(p.name)}${p.code ? " · " + esc(p.code) : ""}${p.on_hand != null ? ` (${qty(p.on_hand)} ${esc(p.unit)})` : ""}</option>`).join("");
  const add = () => {
    const d = document.createElement("div"); d.className = "line";
    d.innerHTML = `<select name="product_id" aria-label="Item">${opts}</select><input name="qty" type="number" step="any" inputmode="decimal" value="1" aria-label="Qty"><input name="price" type="number" step="any" inputmode="decimal" placeholder="${L("Price|단가")}" aria-label="Price"><span class="amt">₱0.00</span><button class="x" type="button" aria-label="Remove">×</button>`;
    $("select", d).onchange = () => { const p = byId(products, $("select", d).value); if (p) $("[name=price]", d).value = priceKey === "cost" ? (p.cost ? Math.round(p.cost * (CO.vat_registered ? 1.12 : 1) * 100) / 100 : "") : p.price; calc(); if (d === box.lastElementChild) add(); };
    $$("input", d).forEach((i) => i.oninput = calc);
    $(".x", d).onclick = () => { if (box.children.length > 1) d.remove(); calc(); };
    box.appendChild(d);
  };
  const calc = () => { let t = 0; $$(".line", box).forEach((d) => { const a = (+$("[name=qty]", d).value || 0) * (+$("[name=price]", d).value || 0); t += $("select", d).value ? a : 0; $(".amt", d).textContent = "₱" + n2(a); }); root.dispatchEvent(new CustomEvent("total", { detail: t })); };
  add();
  const get = () => $$(".line", box).map((d) => ({ product_id: $("select", d).value, qty: $("[name=qty]", d).value, price: $("[name=price]", d).value })).filter((l) => l.product_id);
  get.addProduct = (p) => {  // barcode scan / quick add: same item again → qty + 1
    const same = $$(".line", box).find((d) => $("select", d).value === String(p.id));
    if (same) { const q = $("[name=qty]", same); q.value = (+q.value || 0) + 1; calc(); return; }
    const d = $$(".line", box).find((x) => !$("select", x).value) || (add(), box.lastElementChild);
    $("select", d).value = String(p.id); $("select", d).onchange();
  };
  return get;
}

    [{ label: L("Save|저장"), cls: "pri", fn: async (ov) => { const r = await api("save/" + ent, form(ov)); await list(ent, true); res(r.id); } }], "sm"));
}

// ------------------------------------------------------------------ customer payment terms & post-dated checks (shared)
const ptToday = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const ptM = (v) => Number(v || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ptR = (v) => Math.round(Number(v || 0) * 100) / 100;
const ptAddM = (d, n) => { const [y, m, dd] = d.split("-").map(Number); const t = new Date(Date.UTC(y, m - 1 + n, 1)); const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate(); t.setUTCDate(Math.min(dd, last)); return t.toISOString().slice(0, 10); };
const PT_STATE = { Paid: ["ok", "Paid|완납"], "Partly paid": ["mid", "Partly paid|일부 입금"], Upcoming: ["", "Upcoming|예정"], "Due today": ["warn", "Due today|오늘 납부"],
  Overdue: ["bad", "Overdue|연체"], "Waiting for condition": ["cond", "Waiting for condition|조건 대기"],
  "On hand": ["", "On hand|보관 중"], Deposited: ["mid", "Deposited|입금(교환 중)"], Cleared: ["ok", "Cleared|결제 완료"], Bounced: ["bad", "Bounced|부도"],
  Replaced: ["cond", "Replaced|교체됨"], Returned: ["cond", "Returned|반환"], Posted: ["ok", "Received|입금"], Open: ["ok", "Received|입금"],
  Applied: ["ok", "Applied to invoice|송장에 상계"], "Partly applied": ["mid", "Partly applied|일부 상계"] };
const ptPill = (s) => { const x = PT_STATE[s] || ["", s]; return `<span class="ptp ${x[0]}">${esc(L(x[1]))}</span>`; };
const PT_METHOD_L = { Cash: "Cash|현금", "Check (dated today)": "Check (dated today or earlier)|당일 수표", "Post-dated check": "Post-dated check (PDC)|후일자 수표",
  "Bank transfer / deposit": "Bank transfer / deposit|계좌이체·은행 입금", "Online (InstaPay / PESONet)": "Online (InstaPay / PESONet)|온라인 송금", "GCash / Maya": "GCash / Maya|GCash·Maya",
  "Credit / debit card": "Credit / debit card|카드" };
const PT_KIND_L = { down: "Down payment|계약금", progress: "Progress payment|중도금", balance: "Balance|잔금", installment: "Installment|분할 납부", retention: "Retention|유보금", full: "Full payment|일시불" };
const PT_COND_L = { "Upon signing of contract": "계약 체결 시", "Upon delivery": "납품 시", "Upon installation": "설치 완료 시", "Upon completion": "공사·작업 완료 시",
  "Upon acceptance / turnover": "검수·인도 시", "Upon release of permit": "인허가 발급 시", "After warranty / retention period": "하자보증 기간 후" };
const PT_BOUNCE = ["DAIF — drawn against insufficient funds", "DAUD — drawn against uncollected deposit", "Account closed", "Stop payment", "Signature differs", "Stale / postdated", "Other"];
const ptF = (label, inner, cls = "") => `<label class="f ${cls}"><span>${L(label)}</span>${inner}</label>`;
const ptIn = (n, v = "", t = "text", extra = "") => `<input name="${n}" type="${t}" value="${esc(v)}" ${t === "number" ? 'step="any" inputmode="decimal"' : ""} ${extra} autocomplete="off">`;
const ptSel = (n, opts, v) => `<select name="${n}">${opts.map(([k, l]) => `<option value="${esc(k)}" ${String(k) === String(v) ? "selected" : ""}>${esc(L(l))}</option>`).join("")}</select>`;
const ptRead = (root) => { const o = {}; root.querySelectorAll("input[name],select[name],textarea[name]").forEach((el) => { o[el.name] = el.type === "checkbox" ? (el.checked ? 1 : 0) : el.value; }); return o; };
const ptDocLabel = (d) => `${esc(d.no)} · ${esc(d.customer)}`;

// payment form (cash, check, bank transfer, online, e-wallet, card); post-dated checks go to the PDC register

function ptBindPayForm(root) {
  const m = root.querySelector("[name=method]"); const t = () => { const v = m.value; root.querySelector(".pt-chk").hidden = !/check/i.test(v); root.querySelector(".pt-pdcnote").hidden = v !== "Post-dated check";
    const acc = root.querySelector("[name=account]"); if (acc && v === "Cash" && [...acc.options].some((o) => /cash on hand|cash/i.test(o.text) && !/bank/i.test(o.text))) acc.value = [...acc.options].find((o) => /cash/i.test(o.text) && !/bank/i.test(o.text)).value; };

// schedule editor with presets: full / down + balance on condition / down-progress-balance / down + N monthly / N equal PDCs
function ptEditor(doc, rows, onSave) {
  const box = document.createElement("div");
  let R = rows.length ? rows.map((r) => ({ label: r.label, kind: r.kind, amount: r.amount, due_date: r.due_date || "", condition: r.condition || "" }))
    : [{ label: "Full payment", kind: "full", amount: doc.total, due_date: doc.date || ptToday(), condition: "" }];
  box.innerHTML = `<div class="pt-pre"><b>${L("Quick set-up|빠른 설정")}</b>
    <div class="grid">${ptF("Terms|결제 조건", ptSel("preset", [["full", "Full payment|일시불"], ["db", "Down payment + balance on a condition|계약금 + 조건부 잔금"], ["dpb", "Down payment · progress · balance|계약금·중도금·잔금"],
      ["dn", "Down payment + monthly installments|계약금 + 월 분할"], ["n", "Equal monthly payments / PDCs|균등 월 분할(수표)"]], "dpb"))}
      ${ptF("Down payment %|계약금 %", ptIn("down", 30, "number"))}${ptF("Progress %|중도금 %", ptIn("prog", 40, "number"))}${ptF("Number of months|개월 수", ptIn("n", 6, "number"))}
      ${ptF("First due date|첫 납부일", ptIn("first", ptAddM(doc.date || ptToday(), 1), "date"))}${ptF("Balance condition|잔금 조건", ptIn("cond", "Upon completion", "text", 'list="ptConds"'))}</div>
    <button type="button" class="btn" id="ptApply">${L("Fill in the schedule|일정 채우기")}</button></div>
    <div class="pt-tw"><table class="pt-t pt-ed"><thead><tr><th>#</th><th>${L("Payment|구분")}</th><th>${L("Description|내용")}</th><th class="n">%</th><th class="n">${L("Amount ₱|금액")}</th><th>${L("Due — date or condition|납부 — 날짜 또는 조건")}</th><th></th></tr></thead><tbody></tbody>
    <tfoot><tr><td colspan="3"><button type="button" class="btn" id="ptAdd">+ ${L("Add payment|납부 추가")}</button></td><td class="n" id="ptPct"></td><td class="n" id="ptSum"></td><td colspan="2" id="ptDiff"></td></tr></tfoot></table></div>
    <datalist id="ptConds">${Object.keys(PT_COND_L).map((c) => `<option value="${esc(c)}">${esc(PT_COND_L[c])}</option>`).join("")}</datalist>`;
  const tb = box.querySelector("tbody");
  const draw = () => {
    tb.innerHTML = R.map((r, i) => `<tr data-i="${i}"><td>${i + 1}</td><td>${ptSel("kind", Object.keys(PT_KIND_L).map((k) => [k, PT_KIND_L[k]]), r.kind)}</td><td>${ptIn("label", r.label)}</td>
      <td class="n"><input name="pct" type="number" step="any" value="${doc.total ? ptR(r.amount / doc.total * 100) : ""}" style="width:70px"></td><td class="n">${ptIn("amount", r.amount, "number", 'style="width:120px;text-align:right"')}</td>
      <td><div class="pt-duebox">${ptSel("dt", [["date", "On date|날짜"], ["cond", "On condition|조건"]], r.condition && !r.due_date ? "cond" : "date")}${ptIn("due_date", r.due_date, "date")}${ptIn("condition", r.condition, "text", 'list="ptConds" placeholder="Upon delivery"')}</div></td>
      <td><button type="button" class="btn" data-del="${i}" title="Remove">✕</button></td></tr>`).join("");
    tb.querySelectorAll("tr").forEach((tr) => { const i = +tr.dataset.i; const g = (n) => tr.querySelector(`[name=${n}]`);
      const vis = () => { const c = g("dt").value === "cond"; g("due_date").hidden = c; g("condition").hidden = !c; }; vis();
      g("dt").onchange = () => { vis(); if (g("dt").value === "cond") R[i].due_date = ""; else R[i].condition = ""; };
      g("kind").onchange = () => { R[i].kind = g("kind").value; if (!R[i].label || Object.values(PT_KIND_L).some((l) => l.split("|")[0] === R[i].label)) { R[i].label = PT_KIND_L[R[i].kind].split("|")[0]; g("label").value = R[i].label; } };
      g("label").oninput = () => { R[i].label = g("label").value; };
      g("amount").oninput = () => { R[i].amount = +g("amount").value || 0; g("pct").value = doc.total ? ptR(R[i].amount / doc.total * 100) : ""; sum(); };
      g("pct").oninput = () => { R[i].amount = ptR(doc.total * (+g("pct").value || 0) / 100); g("amount").value = R[i].amount; sum(); };
      g("due_date").oninput = () => { R[i].due_date = g("due_date").value; }; g("condition").oninput = () => { R[i].condition = g("condition").value; }; });
    tb.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => { R.splice(+b.dataset.del, 1); draw(); });
    sum();
  };
  const sum = () => { const s = ptR(R.reduce((a, r) => a + (+r.amount || 0), 0)), d = ptR(doc.total - s);
    box.querySelector("#ptSum").textContent = ptM(s); box.querySelector("#ptPct").textContent = doc.total ? ptR(s / doc.total * 100) + "%" : "";
    box.querySelector("#ptDiff").innerHTML = Math.abs(d) < 0.01 ? `<span class="ptp ok">${L("Matches the total|총액 일치")} ₱${ptM(doc.total)}</span>` : `<span class="ptp bad">${L("Difference|차액")} ₱${ptM(d)}</span>`; };
  box.querySelector("#ptAdd").onclick = () => { R.push({ label: "Installment", kind: "installment", amount: ptR(doc.total - R.reduce((a, r) => a + (+r.amount || 0), 0)), due_date: ptAddM(ptToday(), 1), condition: "" }); draw(); };
  const toggle = () => { const v = box.querySelector("[name=preset]").value, sh = (n, on) => { box.querySelector(`[name=${n}]`).closest("label").hidden = !on; };
    sh("down", v !== "full" && v !== "n"); sh("prog", v === "dpb"); sh("n", v === "dn" || v === "n"); sh("first", v !== "full" && v !== "db"); sh("cond", v === "db" || v === "dpb"); };
  box.querySelector("[name=preset]").onchange = toggle; toggle();
  box.querySelector("#ptApply").onclick = () => {
    const o = ptRead(box.querySelector(".pt-pre")), T = doc.total, start = doc.date || ptToday(), dn = ptR(T * (+o.down || 0) / 100), n = Math.max(1, Math.round(+o.n || 1));
    const split = (amt, k, f) => { const each = Math.floor(amt / k * 100) / 100; return Array.from({ length: k }, (_, j) => f(j, j === k - 1 ? ptR(amt - each * (k - 1)) : each)); };
    if (o.preset === "full") R = [{ label: "Full payment", kind: "full", amount: T, due_date: start, condition: "" }];
    if (o.preset === "db") R = [{ label: `Down payment ${+o.down}%`, kind: "down", amount: dn, due_date: start, condition: "" }, { label: `Balance — ${o.cond}`, kind: "balance", amount: ptR(T - dn), due_date: "", condition: o.cond }];
    if (o.preset === "dpb") { const pg = ptR(T * (+o.prog || 0) / 100); R = [{ label: `Down payment ${+o.down}%`, kind: "down", amount: dn, due_date: start, condition: "" }, { label: `Progress payment ${+o.prog}%`, kind: "progress", amount: pg, due_date: o.first, condition: "" }, { label: `Balance — ${o.cond}`, kind: "balance", amount: ptR(T - dn - pg), due_date: "", condition: o.cond }]; }
    if (o.preset === "dn") R = [{ label: `Down payment ${+o.down}%`, kind: "down", amount: dn, due_date: start, condition: "" }].concat(split(ptR(T - dn), n, (j, a) => ({ label: `Installment ${j + 1} of ${n}`, kind: "installment", amount: a, due_date: ptAddM(o.first, j), condition: "" })));
    if (o.preset === "n") R = split(T, n, (j, a) => ({ label: `Payment ${j + 1} of ${n}`, kind: "installment", amount: a, due_date: ptAddM(o.first, j), condition: "" }));
    draw();
  };
  draw();
  modal(`${L("Payment schedule|결제 일정")} — ${doc.no} (₱${ptM(doc.total)})`, box, [{ label: L("Save schedule|일정 저장"), cls: "pri", fn: async () => {
    const rows = R.map((r) => ({ label: r.label, kind: r.kind, amount: r.amount, due_date: r.condition && !r.due_date ? "" : r.due_date, condition: r.due_date ? "" : r.condition }));
    if (window.DEMO) throw new Error(L("This is a read-only demo — nothing is saved.|읽기 전용 데모입니다."));
    toast((await api("act/pt_save", { doc_type: doc.type, doc_id: doc.id, rows })).message); onSave && onSave(); } }], "lg");
}

// add post-dated checks: one per open installment, or a series (same bank, consecutive numbers, every N months)
function ptAddChecks(d, onSave) {
  const doc = d.doc, open = d.schedule.filter((r) => r.balance > 0.009 && r.balance - r.pdc > 0.009);
  const box = document.createElement("div");
  box.innerHTML = `<div class="grid">${ptF("Bank|은행", ptIn("bank", "", "text", 'list="ptBanks"'))}${ptF("Branch|지점", ptIn("branch"))}${ptF("First check no.|첫 수표번호", ptIn("first_no", "", "text", 'inputmode="numeric"'))}
      ${ptF("Received on|받은 날", ptIn("received_date", ptToday(), "date"))}</div>
    <div class="bar" style="flex-wrap:wrap;gap:8px;margin:8px 0">${open.length ? `<button type="button" class="btn" id="ckSch">${L("One check per open payment in the schedule|일정의 미납 회차별 1장씩")}</button>` : ""}
      <span class="pt-ser">${ptF("Checks|장수", ptIn("n", 6, "number", 'style="width:70px"'))}${ptF("First check date|첫 수표 일자", ptIn("d1", ptAddM(ptToday(), 1), "date"))}${ptF("Every (months)|간격(개월)", ptIn("every", 1, "number", 'style="width:70px"'))}${ptF("Amount each ₱|1장 금액", ptIn("each", doc.balance > 0 ? ptR(doc.balance / 6) : "", "number"))}</span>
      <button type="button" class="btn" id="ckSer">${L("Make the series|연속 수표 만들기")}</button></div>
    <div class="pt-tw"><table class="pt-t"><thead><tr><th>${L("Check no.|수표번호")}</th><th>${L("Check date|수표 일자")}</th><th class="n">${L("Amount ₱|금액")}</th><th>${L("For payment|해당 회차")}</th><th></th></tr></thead><tbody id="ckRows"></tbody>
    <tfoot><tr><td colspan="2"><button type="button" class="btn" id="ckAdd">+ ${L("Add a check|수표 추가")}</button></td><td class="n" id="ckSum"></td><td colspan="2"></td></tr></tfoot></table></div>
    <datalist id="ptBanks">${["BDO", "BPI", "Metrobank", "Landbank", "PNB", "Security Bank", "UnionBank", "China Bank", "RCBC", "EastWest", "PSBank", "AUB", "Maybank", "DBP"].map((b) => `<option value="${b}">`).join("")}</datalist>`;
  let C = [];
  const seqOpts = [["", "— (any)|— (지정 안 함)"]].concat(d.schedule.map((r) => [r.seq, `${r.seq}. ${r.label}|${r.seq}. ${r.label}`]));
  const nextNo = (first, j) => { const m = String(first || "").match(/^(.*?)(\d+)$/); if (!m) return first ? `${first}-${j + 1}` : ""; return m[1] + String(+m[2] + j).padStart(m[2].length, "0"); };
  const draw = () => { const tb = box.querySelector("#ckRows");
    tb.innerHTML = C.map((x, i) => `<tr data-i="${i}"><td>${ptIn("check_no", x.check_no)}</td><td>${ptIn("check_date", x.check_date, "date")}</td><td class="n">${ptIn("amount", x.amount, "number", 'style="width:120px;text-align:right"')}</td><td>${ptSel("seq", seqOpts, x.seq || "")}</td><td><button type="button" class="btn" data-del="${i}">✕</button></td></tr>`).join("");
    tb.querySelectorAll("tr").forEach((tr) => tr.querySelectorAll("input,select").forEach((el) => el.oninput = el.onchange = () => { C[+tr.dataset.i][el.name] = el.value; sum(); }));
    tb.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => { C.splice(+b.dataset.del, 1); draw(); }); sum(); };
  const sum = () => { box.querySelector("#ckSum").textContent = `${C.length} · ₱${ptM(C.reduce((a, x) => a + (+x.amount || 0), 0))}`; };
  const hd = () => ptRead(box.querySelector(".grid"));
  if (box.querySelector("#ckSch")) box.querySelector("#ckSch").onclick = () => { const h = hd(); C = open.map((r, j) => ({ check_no: nextNo(h.first_no, j), check_date: r.effective_due && r.effective_due > ptToday() ? r.effective_due : ptAddM(ptToday(), j + 1), amount: ptR(r.balance - r.pdc), seq: r.seq })); draw(); };
  box.querySelector("#ckSer").onclick = () => { const h = hd(), o = ptRead(box.querySelector(".pt-ser")), n = Math.max(1, Math.round(+o.n || 1)), ev = Math.max(1, Math.round(+o.every || 1));
    C = Array.from({ length: n }, (_, j) => ({ check_no: nextNo(h.first_no, j), check_date: ptAddM(o.d1, j * ev), amount: +o.each || 0, seq: "" })); draw(); };
  box.querySelector("#ckAdd").onclick = () => { const h = hd(); C.push({ check_no: nextNo(h.first_no, C.length), check_date: ptAddM(ptToday(), C.length + 1), amount: "", seq: "" }); draw(); };
  draw();
  modal(`${L("Add post-dated checks|후일자 수표 등록")} — ${doc.no}`, box, [{ label: L("Save checks|수표 저장"), cls: "pri", fn: async () => {
    if (window.DEMO) throw new Error(L("This is a read-only demo — nothing is saved.|읽기 전용 데모입니다."));
    const h = hd(); const checks = C.map((x) => ({ ...x, bank: h.bank, branch: h.branch }));

// actions on one check: deposit / cleared / bounced / replace / return
function ptCheckActions(p, accounts, reload) {
  const go = async (path, body) => { if (window.DEMO) throw new Error(L("This is a read-only demo — nothing is saved.|읽기 전용 데모입니다.")); toast((await api(path, { id: p.id, ...body })).message); reload && reload(); };
  const btns = [];
  if (p.status === "On hand") {
    btns.push([L("Deposit|입금"), "pri", () => modal(`${L("Deposit check|수표 입금")} ${p.bank} #${p.check_no}`, `<p>₱ <b>${ptM(p.amount)}</b> · ${L("Check date|수표 일자")} ${p.check_date}</p><div class="grid">${ptF("Deposit date|입금일", ptIn("date", p.check_date > ptToday() ? p.check_date : ptToday(), "date"))}${ptF("Bank account|입금 계좌", ptSel("account", accounts.map((a) => [a.id, a.name]), (accounts.find((a) => /bank/i.test(a.name)) || accounts[0] || {}).id))}</div>`,
      [{ label: L("Deposit|입금 처리"), cls: "pri", fn: async (ov) => go("act/pdc_deposit", ptRead(ov)) }], "sm")]);
    btns.push([L("Replace…|교체…"), "", () => ptReplace(p, go)]);
    btns.push([L("Return to customer|반환"), "", () => modal(L("Return check|수표 반환"), `<div class="grid">${ptF("Reason|사유", ptIn("reason", "Paid in cash / cancelled"))}</div>`, [{ label: L("Return|반환"), cls: "warn", fn: async (ov) => go("act/pdc_return", ptRead(ov)) }], "sm")]);
  }
  if (p.status === "Deposited") btns.push([L("Cleared|결제 완료"), "pri", () => go("act/pdc_clear", { date: ptToday() })]);
  if (p.status === "Deposited" || p.status === "Cleared") btns.push([L("Bounced…|부도…"), "warn", () => modal(`${L("Bounced check|부도 수표")} ${p.bank} #${p.check_no}`,
    `<p>${L("The collection is reversed and the payment becomes open again.|수금이 취소되고 해당 회차가 다시 미납이 됩니다.")}</p><div class="grid">${ptF("Date returned|부도 통보일", ptIn("date", ptToday(), "date"))}${ptF("Reason|사유", ptSel("reason", PT_BOUNCE.map((x) => [x, x]), PT_BOUNCE[0]))}${ptF("Bank charge ₱|은행 수수료", ptIn("charge", "", "number"))}</div>`,
    [{ label: L("Record bounce|부도 처리"), cls: "warn", fn: async (ov) => go("act/pdc_bounce", ptRead(ov)) }], "sm")]);
  if (p.status === "Bounced" && !p.replaced_by) btns.push([L("Replacement check…|대체 수표…"), "pri", () => ptReplace(p, go)]);
  return btns;
}
function ptReplace(p, go) {
  modal(`${L("Replacement check|대체 수표")} — ${p.bank} #${p.check_no}`, `<div class="grid">${ptF("Bank|은행", ptIn("bank", p.bank))}${ptF("Check no.|수표번호", ptIn("check_no"))}${ptF("Check date|수표 일자", ptIn("check_date", p.check_date > ptToday() ? p.check_date : ptToday(), "date"))}${ptF("Amount ₱|금액", ptIn("amount", p.amount, "number"))}</div>`,
    [{ label: L("Save|저장"), cls: "pri", fn: async (ov) => go("act/pdc_replace", ptRead(ov)) }], "sm");
}

      <td class="n">${ptM(p.amount)}</td><td>${ptPill(p.status)}${p.status === "Bounced" ? `<br><small class="muted">${esc(p.bounce_reason || "")}</small>` : ""}${p.deposit_date ? `<br><small class="muted">${L("deposited|입금")} ${esc(p.deposit_date)}</small>` : ""}</td>

function hrLogoFile(file) {  // any picture -> data URL sized for print (max 800 x 320, transparent PNG when it fits)
  return new Promise((res, rej) => { if (!file) return rej(new Error(L("Choose a picture file.|그림 파일을 선택하세요.")));
    const img = new Image(); img.onload = () => { const r = Math.min(1, 800 / img.width, 320 / img.height); const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(img.width * r)); cv.height = Math.max(1, Math.round(img.height * r));
      const g = cv.getContext("2d"); g.drawImage(img, 0, 0, cv.width, cv.height); let url = cv.toDataURL("image/png");
      if (url.length > 560000) { g.globalCompositeOperation = "destination-over"; g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); url = cv.toDataURL("image/jpeg", 0.9); }
      res(url); };
    img.onerror = () => rej(new Error(L("That file is not a picture (use PNG, JPG or SVG).|그림 파일이 아닙니다 (PNG·JPG·SVG).")));
    img.src = URL.createObjectURL(file); });
}

const LENDER_L = { Bank: "Bank|은행", "Financing company": "Financing / lending company|금융·할부사", Individual: "Person (owner, relative, friend)|개인(대표·가족·지인)", Company: "Another company|다른 회사", Government: "Government program|정부 지원" };
const METHOD_L = { diminishing: "Same amount every month (bank style)|매월 같은 금액(은행식 원리금 균등)", flat: "Add-on interest (lending company)|Add-on 이자(할부·대부업식)", interest_only: "Interest monthly, principal at the end|이자만 매월, 원금은 마지막에", none: "No interest, equal monthly parts|무이자, 매월 나눠 갚기", lump_sum: "Pay everything at the end|만기에 한꺼번에" };
function addMonths(d, n) { const [y, m, dd] = d.split("-").map(Number); const t = new Date(Date.UTC(y, m - 1 + n, 1)); const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate(); t.setUTCDate(Math.min(dd, last)); return t.toISOString().slice(0, 10); }
function loanSchedule(P, rate, method, n, first) {  // same rules as lite/loans.py — preview only
  const R = (x) => Math.round(x * 100) / 100; P = +P; n = Math.max(1, +n || 1); const r = (+rate || 0) / 1200; const out = [];
  if (method === "lump_sum") return [{ seq: 1, due_date: first, principal: R(P), interest: R(P * r * n) }];
  if (method === "diminishing" && r > 0) { const pay = P * r / (1 - Math.pow(1 + r, -n)); let bal = P; for (let k = 1; k <= n; k++) { const i = R(bal * r); const p = k === n ? R(bal) : R(pay - i); bal = R(bal - p); out.push({ seq: k, due_date: addMonths(first, k - 1), principal: p, interest: i }); } return out; }
  const pp = R(P / n), ti = method === "flat" ? R(P * (+rate || 0) / 100 * n / 12) : 0, pi = R(ti / n);
  for (let k = 1; k <= n; k++) { let p = k === n ? R(P - pp * (n - 1)) : pp, i = 0; if (method === "interest_only") { p = k === n ? R(P) : 0; i = R(P * r); } else if (method === "flat") i = k === n ? R(ti - pi * (n - 1)) : pi; out.push({ seq: k, due_date: addMonths(first, k - 1), principal: p, interest: i }); }
  return out;
}

    [{ label: L("Save & print slip|저장 후 확인서 인쇄"), cls: "pri", fn: async (o) => { const r = await api("act/cash_advance", form(o)); toast(r.message); CACHE.employees = null; route(); setTimeout(() => advanceDialog(r.id, true), 250); } }], "sm");
  const sel = $("[name=employee_id]", ov), amt = $("[name=amount]", ov), inst = $("[name=installment]", ov);

async function advanceDialog(id, fresh) {

  pg.innerHTML = head("Company settings|회사 설정", `ERP Small Business-50 v${s.version}`) +
    `<div class="card" id="co"><h3>${L("Your company|회사 정보")}</h3><p class="muted" style="margin-top:0">${L("Shown on receipts, payslips and reports.|영수증·급여명세서·보고서에 표시됩니다.")}</p><div class="grid">${fld("company_name", "Company name|회사명", s.name, { req: 1 })}${fld("company_tin", "TIN", s.tin)}${fld("company_phone", "Phone|전화", s.phone)}${fld("company_address", "Address|주소", s.address, { t: "area" })}${fld("receipt_note", "Message at the bottom of receipts|영수증 하단 문구", s.receipt_note, { wide: 1 })}</div></div>
    ${s.letterhead ? `<div class="card" id="lh"><h3>${L("Letterhead & signatory (certificates and ID)|레터헤드·서명권자 (증명서·사원증)")}</h3><p class="muted" style="margin-top:0">${L("Used on the Certificate of Employment, SSS loan employer certification, Pag-IBIG certificate of net pay and company ID.|재직증명서, SSS 대출 고용주 확인서, Pag-IBIG 실수령액 증명서, 사원증에 사용됩니다.")}</p>${letterheadFields(s.letterhead, (n, l, v) => fld(n, l, v))}</div>` : ""}
    <div class="card" id="bt"><h3>${L("Type of business|업종")}</h3><p class="muted" style="margin-top:0">${L("Tap your type of business. The menus and tools change to fit it; you can fine-tune each tool below. Nothing is deleted when you switch.|업종을 누르면 메뉴와 기능이 업종에 맞게 바뀝니다. 아래에서 기능을 하나씩 조정할 수 있으며, 바꿔도 자료는 삭제되지 않습니다.")}</p>
      <div class="biz">${Object.entries(s.industries).map(([k, v]) => `<button type="button" data-b="${k}" class="${k === s.business_type ? "on" : ""}"><i>${v.icon}</i><b>${esc(L(v.label))}</b><span>${esc(L(v.desc))}</span></button>`).join("")}</div>
      <h3 style="margin-top:16px">${L("Tools switched on|사용 중인 기능")}</h3><div class="feats">${Object.entries(s.feature_list).map(([k, [lab, help]]) => `<label class="chk"><input type="checkbox" name="${k}" ${s.features[k] ? "checked" : ""}> ${esc(L(lab))}<small>${esc(L(help))}</small></label>`).join("")}</div>
      <div class="grid" style="margin-top:10px" id="svcp" ${s.features.service_charge ? "" : "hidden"}>${fld("service_charge_pct", "Service charge % (dine-in)|봉사료 %(매장 식사)", s.service_charge_pct, { t: "num" })}</div></div>
    <div class="card" id="tx"><h3>${L("Taxes|세금")}</h3><div class="grid">${fld("vat_registered", "VAT-registered with BIR (12% VAT)|부가세 등록 사업자(12%)", s.vat_registered, { t: "check" })}${fld("prices_include_vat", "My selling prices already include VAT|판매가에 부가세 포함", s.prices_include_vat, { t: "check" })}</div>
      <p class="muted">${L("Not VAT-registered? Reports estimate 3% percentage tax on sales instead.|부가세 미등록이면 보고서에 매출의 3% 과세를 추정해 표시합니다.")}</p></div>
    <div class="card" id="py"><h3>${L("Work week|근무 형태")}</h3><div class="grid">${fld("week", "Days worked per week|주당 근무일", p.factor >= 313 ? 6 : 5, { t: "select", opts: [[6, "6 days (Mon–Sat)|주 6일(월~토)"], [5, "5 days (Mon–Fri)|주 5일(월~금)"]] })}${fld("grace_minutes", "Late grace period (minutes)|지각 유예(분)", p.grace_minutes, { t: "num" })}
      ${fld("advance_limit_pct", "Cash advance limit (% of monthly pay, 0 = no limit)|가불 한도(월급 대비 %, 0=제한 없음)", p.advance_limit_pct, { t: "num" })}${fld("advance_installments", "Pay back advances over (paydays)|가불 기본 상환 횟수(급여일)", p.advance_installments, { t: "num" })}</div>
      <details class="adv"><summary>${L("Advanced payroll rates (change only when the law changes)|고급 급여 요율(법 개정 시에만 변경)")}</summary><div class="grid" style="margin-top:10px">${[["sss_ee", "SSS employee rate|SSS 본인"], ["sss_er", "SSS employer rate|SSS 회사"], ["sss_min", "SSS MSC minimum|MSC 하한"], ["sss_max", "SSS MSC maximum|MSC 상한"], ["ph_rate", "PhilHealth rate|PhilHealth 요율"], ["ph_floor", "PhilHealth floor|하한"], ["ph_ceiling", "PhilHealth ceiling|상한"], ["pi_rate", "Pag-IBIG rate (each)|Pag-IBIG 요율"], ["pi_cap", "Pag-IBIG salary cap|상한"], ["nd_rate", "Night differential|야간수당률"], ["deduction_method", "Deductions: 1 = half each payday, 2 = all on 2nd payday|공제 방식 1=반반 2=2차 일괄"]].map(([k, l]) => fld(k, l, p[k], { t: "num" })).join("")}</div></details></div>
    <div class="card" id="licf"><h3>${L("Software license|소프트웨어 라이선스")}</h3>${licenseCard(s.license, ME && ME.role === "owner")}</div>
    <div class="card"><h3>${L("Developer|개발사")}</h3><div class="grid"><label class="f">${L("Developer|개발사")}<input value="${esc(s.developer.name)}" disabled></label><label class="f">${L("Mobile|휴대폰")}<input value="${esc(s.developer.mobile)}" disabled></label></div><p class="muted">${L("Fixed in the program. Call for help or to upgrade to ERP Enterprise-500 (more than 50 employees).|프로그램에 고정된 정보입니다. 지원 요청이나 50명 초과 시 ERP Enterprise-500 업그레이드 문의")}</p></div>
    <div class="bar" style="margin-top:14px"><span class="grow"></span><button class="btn pri" id="sv">${L("Save settings|설정 저장")}</button></div>`;
  let biz = s.business_type;
  $$(".biz button", pg).forEach((b) => b.onclick = () => { biz = b.dataset.b; $$(".biz button", pg).forEach((x) => x.classList.toggle("on", x === b));
    const on = new Set(s.industries[biz].features); $$(".feats input", pg).forEach((i) => i.checked = on.has(i.name)); $("#svcp", pg).hidden = !on.has("service_charge");
    toast(L("Tools set for this business type. Press Save settings to keep.|업종에 맞게 기능을 설정했습니다. 설정 저장을 누르세요.")); });
  $(".feats [name=service_charge]", pg).onchange = (e) => { $("#svcp", pg).hidden = !e.target.checked; };
  if (s.letterhead) { const ph = $("#lh [name=company_phone]", pg); if (ph) ph.closest("label").remove(); }
  const getLogo = s.letterhead ? bindLogo($("#lh", pg), s.letterhead) : null; bindLicenseCard($("#licf", pg));
  $("#sv", pg).onclick = () => run(async () => {
    const co = { ...form($("#co", pg)), ...(getLogo ? { ...form($("#lh", pg)), company_logo: getLogo() } : {}) }, tx = form($("#tx", pg)), py = form($("#py", pg)), bt = form($("#bt", pg));
    const features = Object.fromEntries(Object.keys(s.feature_list).map((k) => [k, bt[k]])); tx.business_type = biz; tx.features = features; tx.service_charge_pct = bt.service_charge_pct;
    const six = +py.week === 6; const pay = { factor: six ? 313 : 261, rest_from_weekday: six ? 7 : 6 };
    Object.keys(py).filter((k) => k !== "week").forEach((k) => pay[k] = Number(py[k]));
    toast((await api("act/settings", { ...co, ...tx, payroll: pay })).message);
    CO = await api("report/company"); shell(); route();
  });
};
MASTER.users = { area: "admin", title: "User|사용자", fields: (r) => [fld("username", "Login name|아이디", "", { req: 1 }), fld("full_name", "Full name|이름"), fld("role", "Can use|권한", "staff", { t: "select", opts: Object.entries(ROLES) }), fld("password", r.id ? "New password (leave blank to keep)|새 비밀번호(비우면 유지)" : "Password (6+ characters)|비밀번호(6자 이상)", "", { t: "pw" }), fld("active", "Can sign in|로그인 허용", 1, { t: "check" })] };
PAGES.users = async (pg) => {
  const rows = await list("users", true);
  pg.innerHTML = head("Users & passwords|사용자·비밀번호", "Give each person their own login. Staff can sell, buy and count stock but cannot see profit or payroll.|각자 아이디를 주세요. 직원 권한은 판매·구매·재고만 가능하고 이익·급여는 볼 수 없습니다.") +
    `<div class="bar"><span class="grow"></span><button class="btn pri" id="new">${L("Add user|사용자 추가")}</button></div>` + table([{ k: "username", l: "Login|아이디" }, { k: "full_name", l: "Name|이름" }, { k: "role", l: "Can use|권한", f: (v) => esc(L(ROLES[v] || v)) }, { k: "active", l: "", f: (v) => v ? "" : pill(L("Off|중지")) }], rows, { click: 1 });
  onRow(pg, rows, (u) => editMaster("users", u));
  $("#new", pg).onclick = () => editMaster("users", { role: "staff", active: 1 });
};
PAGES.backup = (pg) => {
  pg.innerHTML = head("Backup|백업", "All your records are in one file. Download a backup every day and keep a copy on a USB or Google Drive.|모든 기록이 파일 하나에 있습니다. 매일 백업을 내려받아 USB나 구글 드라이브에 보관하세요.") +
    `<div class="card"><h3>${L("Download backup|백업 내려받기")}</h3><a class="btn pri" href="${window.DEMO ? "#/backup" : "/api/backup"}" ${window.DEMO ? `onclick="toast(L('Backups work in the installed version.|백업은 설치 버전에서 가능합니다.'));return false"` : ""}>${L("Download backup now|지금 백업")}</a></div>
    <div class="card"><h3>${L("Restore from a backup|백업에서 복원")}</h3><p class="note">${L("This replaces everything with the backup. The current data is kept as a copy on this computer.|백업으로 모든 데이터를 바꿉니다. 현재 데이터는 이 컴퓨터에 사본으로 보관됩니다.")}</p><input type="file" id="rf" accept=".db"> <button class="btn warn" id="rb">${L("Restore|복원")}</button></div>`;
  $("#rb", pg).onclick = () => run(async () => { const f = $("#rf", pg).files[0]; if (!f) throw new Error(L("Choose the backup file.|백업 파일을 선택하세요.")); if (!(await confirmBox(L("Replace all data with this backup?|이 백업으로 모든 데이터를 바꿀까요?")))) return; toast((await api("restore", await f.arrayBuffer())).message); setTimeout(boot, 1200); });
};

// ------------------------------------------------------------------ SIGN-IN & SETUP
function authScreen(setup) {
  $("#app").innerHTML = `<div class="auth"><form class="card" id="af" ${setup ? 'style="width:min(780px,100%)"' : ""}><h1>ERP <span class="badge">Small Business-50</span></h1><p class="sub">${setup ? L("Set up your business in one minute.|1분 만에 회사를 설정하세요.") : esc(CO.name || L("Sign in to continue.|로그인하세요."))}</p><div class="grid">
    ${setup ? `${fld("company_name", "Company name (shown on receipts)|회사명(영수증에 표시)", "", { req: 1, ph: "e.g. Santos Trading|예: Santos Trading" })}<div class="f wide"><span>${L("Type of business — tap one|업종 — 하나를 누르세요")}</span><input type="hidden" name="business_type" value="retail"><div class="biz">${Object.entries(INDUSTRIES).map(([k, v]) => `<button type="button" data-b="${k}" class="${k === "retail" ? "on" : ""}"><i>${v.icon}</i><b>${esc(L(v.label))}</b><span>${esc(L(v.desc))}</span></button>`).join("")}</div></div>
      ${fld("work_days", "Days worked per week|주당 근무일", 6, { t: "select", opts: [[6, "6 days|6일"], [5, "5 days|5일"]] })}${fld("vat_registered", "VAT-registered with BIR|부가세 등록 사업자", 0, { t: "check" })}${fld("full_name", "Your name|대표 이름")}` : ""}
    ${fld("username", "Login name|아이디", setup ? "owner" : "")}${fld("password", "Password|비밀번호" + (setup ? " (6+)" : ""), "", { t: "pw" })}
    ${setup ? fld("demo", "Fill with sample data to try it out|샘플 데이터로 체험하기", 0, { t: "check" }) : ""}</div>
    <div class="bar" style="margin-top:16px"><button class="btn pri" style="flex:1">${setup ? L("Start|시작하기") : L("Sign in|로그인")}</button><button type="button" class="btn" id="lg">${LANG === "en" ? "한국어" : "English"}</button></div><p id="msg" class="muted"></p>${devHTML()}</form></div>`;
  $("#lg").onclick = () => { LANG = LANG === "en" ? "ko" : "en"; LS.set("lite_lang", LANG); authScreen(setup); };
  $$(".biz button").forEach((b) => b.onclick = () => { $("[name=business_type]").value = b.dataset.b; $$(".biz button").forEach((x) => x.classList.toggle("on", x === b)); });
  $("#af").onsubmit = async (e) => {
    e.preventDefault(); const f = form($("#af")); f.lang = LANG;
    if (setup && f.demo) $("#msg").textContent = L("Creating sample business… a few seconds.|샘플 회사를 만드는 중…");
    try { if (setup) await api("setup", f); await api("login", { username: f.username, password: f.password }); boot(); } catch (er) { $("#msg").innerHTML = `<span class="neg">${esc(er.message)}</span>`; }
  };
}
async function boot() {
  ME = null;
  const st = await fetch("/api/status").then((r) => r.json()).catch(() => ({}));
  CO = { name: st.company || "" }; INDUSTRIES = st.industries || {};
  document.title = CO.name ? `${CO.name} — ERP Small Business-50` : "ERP Small Business-50";
  if (st.license_needed) return licenseScreen(st, "ERP Small Business-50");
  if (st.setup_needed) return authScreen(true);
  try {
    const me = await api("me"); ME = me.user; AREAS = me.areas; ROLES = me.roles;
    if (ME.lang && !LS.get("lite_lang") && !window.ERP_DEFAULT_LANG) LANG = ME.lang;
    CO = await api("report/company");
    Object.keys(CACHE).forEach((k) => delete CACHE[k]);
    shell(); route();
  } catch (e) { authScreen(false); }
}
window.toast = toast; window.L = (s) => L(s);
boot();
</script>
