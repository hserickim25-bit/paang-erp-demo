<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BalikHome</title>
<meta name="description" content="BalikHome — book verified beauty, massage and pet-grooming pros at home. Test build.">
<meta name="theme-color" content="#12355B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BalikHome">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: a sticky prototype bar over a stage. Customer and provider apps render as phones side by side;
   business and admin render as desktop web consoles. One shared, live data model drives every view. */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#F3F5F9; --surface-3:#E8ECF2;
  --fg:#0C1222; --fg-2:#344054; --muted:#5F6B7E; --line:#E3E6EC; --line-2:#D2D7E0;
  --accent:#12355B; --accent-hover:#0D2846; --accent-soft:#E8EEF8; --accent-ink:#FFFFFF;
  --mango:#F4B740; --mango-ink:#0D2846; --mango-soft:#FFF4DC; --info:#3551E0;
  --brand-grad:linear-gradient(160deg,#0D2846 0%,#12355B 55%,#1C4677 100%);
  --good:#0F8F4E; --good-dot:#18B263; --good-soft:#E7F6EE;
  --warn:#8A5A00; --warn-dot:#F2B300; --warn-soft:#FFF5DA;
  --bad:#C9302F; --bad-dot:#E5484D; --bad-soft:#FDEDED;
  --ink:#0C1222; --ink-fg:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06),0 1px 1px rgba(15,23,42,.03);
  --shadow-md:0 10px 28px -12px rgba(15,23,42,.22),0 2px 6px rgba(15,23,42,.05);
  --shadow-lg:0 40px 80px -30px rgba(15,23,42,.38),0 8px 24px -8px rgba(15,23,42,.12);
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r-sm:8px; --r:12px; --r-lg:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08090D; --surface:#111319; --surface-2:#161922; --surface-3:#1E222D;
  --fg:#EEF1F6; --fg-2:#C4CAD6; --muted:#8E97A8; --line:#232733; --line-2:#2F3441;
  --accent:#8DB0E6; --accent-hover:#A9C4EE; --accent-soft:#15233A; --accent-ink:#081428;
  --mango:#F4B740; --mango-ink:#0D2846; --mango-soft:#2A220C; --info:#8EA0FF;
  --good:#45D48C; --good-dot:#2FCB7A; --good-soft:#0E271B;
  --warn:#F6C752; --warn-dot:#F2B300; --warn-soft:#2A220C;
  --bad:#FF7A7C; --bad-dot:#F05A5E; --bad-soft:#2D1415;
  --ink:#EEF1F6; --ink-fg:#0C1222;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 12px 30px -12px rgba(0,0,0,.6); --shadow-lg:0 40px 80px -30px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08090D; --surface:#111319; --surface-2:#161922; --surface-3:#1E222D;
  --fg:#EEF1F6; --fg-2:#C4CAD6; --muted:#8E97A8; --line:#232733; --line-2:#2F3441;
  --accent:#8DB0E6; --accent-hover:#A9C4EE; --accent-soft:#15233A; --accent-ink:#081428;
  --mango:#F4B740; --mango-ink:#0D2846; --mango-soft:#2A220C; --info:#8EA0FF;
  --good:#45D48C; --good-dot:#2FCB7A; --good-soft:#0E271B;
  --warn:#F6C752; --warn-dot:#F2B300; --warn-soft:#2A220C;
  --bad:#FF7A7C; --bad-dot:#F05A5E; --bad-soft:#2D1415;
  --ink:#EEF1F6; --ink-fg:#0C1222;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 12px 30px -12px rgba(0,0,0,.6); --shadow-lg:0 40px 80px -30px rgba(0,0,0,.8);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
.ic{flex-shrink:0;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Prototype bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.02em;border:0;background:transparent;padding:4px 6px;margin:-4px -6px;border-radius:10px;color:var(--fg)}
button.brand:hover{background:var(--surface-2)}
.brand-mark{width:30px;height:30px;border-radius:9px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 1px var(--line)}.brand-mark img{width:26px;height:26px;object-fit:contain}
.brand small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-3);overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.clock{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--muted)}
.clock .num{color:var(--fg);font-weight:600}
.mini{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--fg-2)}
.mini:hover{border-color:var(--muted)}

/* ---------- Stage ---------- */
.stage{max-width:1440px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.duo{display:flex;flex-wrap:wrap;justify-content:center;gap:32px 48px}
.duo-col{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.duo-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.intro{max-width:880px;margin:0 auto 24px;text-align:center;display:flex;flex-direction:column;gap:6px}
.intro h1{font-size:22px}
.intro p{color:var(--muted);font-size:14px}

/* ---------- Phone device ---------- */
.device{width:min(400px,100%);height:min(840px,calc(100dvh - 140px));min-height:640px;border-radius:40px;background:var(--surface);box-shadow:var(--shadow-lg);border:1px solid var(--line);padding:10px;position:relative}
.screen{position:relative;height:100%;border-radius:31px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
@media (max-width:640px){
  .device{width:100%;height:calc(100dvh - 120px);min-height:560px;border-radius:24px;padding:0;border:0;box-shadow:none}
  .screen{border-radius:20px}
}
.appbar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;min-height:58px}
.appbar h2{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg);position:relative;flex-shrink:0}
.iconbtn:hover{background:var(--surface-2)}
.badge-n{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad-dot);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.scroll{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0;padding-bottom:4px}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;font-size:10.5px;font-weight:500;color:var(--muted);position:relative}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .badge-n{top:3px;right:calc(50% - 20px)}
.footer-bar{background:var(--surface);border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}

/* ---------- Primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.flat{box-shadow:none}
.card.tight{padding:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-h h3{font-size:15px;font-weight:600}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.divider{height:1px;background:var(--line);margin:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:15px;text-decoration:none;transition:background .15s,transform .05s}
.btn:active{transform:scale(.985)}
.btn.block{width:100%}
.btn.sm{height:36px;font-size:13px;padding:0 12px;border-radius:10px}
.btn.xs{height:30px;font-size:12px;padding:0 10px;border-radius:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ink{background:var(--ink);color:var(--ink-fg)}
.btn.mango{background:var(--mango);color:var(--mango-ink)}
.btn.mango:hover{filter:brightness(1.04)}
.btn.secondary{background:var(--surface);border-color:var(--line-2);color:var(--fg)}
.btn.secondary:hover{border-color:var(--muted)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--surface);border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.btn.good{background:var(--good-dot);color:#04170D}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--fg-2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.outline{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.green{background:var(--good-dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--good-dot) 22%,transparent)}
.dot.yellow{background:var(--warn-dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn-dot) 22%,transparent)}
.dot.red{background:var(--bad-dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad-dot) 22%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:500;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--fg-2)}
.input,.select,.textarea{width:100%;height:44px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;font-size:15px;color:var(--fg)}
.textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.check{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--fg-2);line-height:1.4}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex-shrink:0}
.progress{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.progress>span{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .4s}
.progress.good>span{background:var(--good-dot)}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:600;flex-shrink:0;letter-spacing:-.02em}
.photo{border-radius:10px;position:relative;overflow:hidden;background-size:cover;background-position:center}
.photo .ic{position:absolute;inset:auto 6px 6px auto;color:#fff;opacity:.85}
.stars{color:#E8A400;letter-spacing:1px}
.stars .off{color:var(--line-2)}

/* list rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;min-width:0}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--surface-2)}

/* provider cards */
.pcard{display:flex;gap:12px;padding:12px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);text-align:left;width:100%;align-items:flex-start;transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow-md)}
.pcard .meta{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.pcard .name{font-weight:600;font-size:15px}
.pcard .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.status-line{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.tl{display:inline-flex;flex-direction:row;align-items:center;gap:4px;padding:4px 6px;border-radius:999px;background:linear-gradient(180deg,#2A303B,#151920);flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08)}
.tl i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#C3C8CF,#8E959F 70%);display:block;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.tl i.on.r{background:radial-gradient(circle at 35% 35%,#FF9A9C,#F05A5E 60%);box-shadow:0 0 8px 1px #F05A5E}
.tl i.on.y{background:radial-gradient(circle at 35% 35%,#FFE38A,#F2B300 60%);box-shadow:0 0 8px 1px #F2B300}
.tl i.on.g{background:radial-gradient(circle at 35% 35%,#8BF0BB,#2FCB7A 60%);box-shadow:0 0 8px 1px #2FCB7A}
.cal{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px}
.cal .iconbtn:first-child svg{transform:rotate(180deg)}.cal .iconbtn[disabled]{opacity:.3}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-h{font-size:11px;font-weight:600;color:var(--muted);padding:2px 0}
.cal-d{height:40px;border-radius:10px;border:0;background:transparent;font:inherit;font-size:15px;color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.cal-d:hover:not([disabled]){background:var(--surface-2)}.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--accent)}.cal-d.off{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.cal-d[aria-pressed="true"],.cal-d[aria-pressed="true"]:hover{background:var(--accent);color:#fff;text-decoration:none;font-weight:700}.cal-d[disabled]{opacity:.28;cursor:default}
.cal-d.open{background:var(--accent-soft);font-weight:600}.cal-key.open{background:var(--accent-soft)}
.cal-key{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);vertical-align:-1px;margin-right:4px}.cal-key.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.chatlog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--surface-2);border-radius:12px;min-height:0}
.bub{max-width:80%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:7px 10px;display:flex;flex-direction:column;gap:2px}.bub span{font-size:14px;white-space:pre-wrap;word-break:break-word}.bub i{font-style:normal;font-size:10.5px;color:var(--muted);align-self:flex-end}
.bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-color:transparent;border-radius:14px 14px 4px 14px}.bub.me i{color:rgba(255,255,255,.75)}
.callscreen{position:absolute;inset:0;z-index:60;background:linear-gradient(180deg,#0E2440,#12355B 55%,#1C4C7A);color:#fff;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:24px;animation:fade .2s}
.callbtn{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.35)}.callbtn.ok{background:#22B573}.callbtn.end{background:#E5484D}.callbtn.end svg{transform:rotate(135deg)}.callbtn.mute{background:rgba(255,255,255,.16)}.callbtn.mute.on{background:#fff;color:#12355B}
.lmap{height:230px;border-radius:12px;overflow:hidden;background:var(--surface-2);position:relative;z-index:0}
.mk{background:none;border:0}.mkp{width:46px;height:46px;border-radius:50%;border:3px solid #F4B740;box-shadow:0 3px 10px rgba(0,0,0,.35);overflow:hidden;display:grid;place-items:center;background:#12355B;color:#fff;font-weight:700}.mkp img{width:100%;height:100%;object-fit:cover}
.livedot{width:9px;height:9px;border-radius:50%;background:var(--line-2);display:inline-block}.livedot.on{background:#2FCB7A;box-shadow:0 0 0 0 rgba(47,203,122,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,203,122,.6)}70%{box-shadow:0 0 0 9px rgba(47,203,122,0)}100%{box-shadow:0 0 0 0 rgba(47,203,122,0)}}
.camview{width:100%;flex:1;min-height:260px;max-height:62vh;border-radius:14px;overflow:hidden;background:#000;display:block}.camview video{width:100%;height:100%;object-fit:cover;display:block}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;align-self:center;display:grid;place-items:center;padding:0;cursor:pointer}.shutter span{width:60px;height:60px;border-radius:50%;background:#fff;display:block}.shutter:active span{transform:scale(.92)}
.tl.m{gap:6px;padding:6px 9px}.tl.m i{width:15px;height:15px}
.tl.m i.on.r{box-shadow:0 0 12px 2px #F05A5E}.tl.m i.on.y{box-shadow:0 0 12px 2px #F2B300}.tl.m i.on.g{box-shadow:0 0 12px 2px #2FCB7A}
.status-line{gap:8px}.status-line.big{font-size:14px}
.status-line.green{color:var(--good)} .status-line.yellow{color:var(--warn)} .status-line.red{color:var(--bad)}
.ret{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px}

/* categories */

.fab{position:fixed;z-index:70;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));height:40px;padding:0 14px;border-radius:20px;border:0;background:var(--mango);color:var(--mango-ink);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:0 10px 24px -8px rgba(13,40,70,.5)}

@media(min-width:700px){.demo-sheet{justify-content:center;align-items:center}.demo-sheet .sheet{max-width:460px;border-radius:22px}}

.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rolegrid button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-align:left}

/* photos */
.avatar.ph{overflow:hidden;background:var(--surface-3)}

.bizlogo{position:relative;width:68px;height:68px;border-radius:16px;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(135deg,#12355B,#2B5C93);color:#F4B740;font-weight:800;font-size:34px;letter-spacing:-.02em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bizbadge{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--surface);color:#12355B;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.listph{position:relative;width:68px;height:68px;border-radius:16px;overflow:visible;flex-shrink:0;cursor:zoom-in}
.listph img{width:100%;height:100%;object-fit:cover;border-radius:16px;display:block}
.listph .zbadge{width:20px;height:20px;right:-4px;bottom:-4px}
.lightbox{position:absolute;inset:0;z-index:25;background:rgba(5,8,14,.88);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s;cursor:zoom-out}
.lb-in{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;animation:zoomin .22s cubic-bezier(.2,.8,.2,1);cursor:default}

<div id="app"></div>

<script>
(() => {
'use strict';

/* ================= Utilities ================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const realStart = Date.now();
const simStart = (() => { const d = new Date(); d.setHours(13, 0, 0, 0); return d.getTime(); })();
let skip = 0;
const now = () => simStart + (Date.now() - realStart) + skip;
const fmtT = t => new Date(t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const fmtD = t => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
/* ---------- usual working hours (reference only; the traffic light decides live availability) ---------- */
const DAYS3 = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const fmtMin = m => { m = ((m % 1440) + 1440) % 1440; return new Date(2026, 0, 1, Math.floor(m / 60), m % 60).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); };
const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmtWhen = t => { const d0 = dayStart(now()), d = dayStart(t); const day = d === d0 ? 'Today' : d === d0 + DAY ? 'Tomorrow' : new Date(t).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); return day + ' ' + fmtT(t); };
const availOf = p => (p && p.avail) || (p && p.biz && biz(p.biz) && biz(p.biz).avail) || defAvail();
const defAvail = () => ({ days: [1, 1, 1, 1, 1, 1, 0], from: 540, to: 1260 });
function daysText(d) {
  const on = d.map((x, i) => x ? i : -1).filter(i => i >= 0);
  if (on.length === 7) return 'Every day'; if (!on.length) return 'No set days';
  const runs = []; let st = on[0], pr = on[0];
  for (let k = 1; k <= on.length; k++) { if (on[k] === pr + 1) { pr = on[k]; continue; } runs.push(st === pr ? DAYS3[st] : pr - st === 1 ? DAYS3[st] + ', ' + DAYS3[pr] : DAYS3[st] + '–' + DAYS3[pr]); st = pr = on[k]; }
  return runs.join(', ');
}
const availText = av => `${daysText(av.days)} · ${fmtMin(av.from)}–${fmtMin(av.to)}${av.to <= av.from ? ' (next day)' : ''}`;
function inUsual(av, t) {
  const d = new Date(t), wd = (d.getDay() + 6) % 7, m = d.getHours() * 60 + d.getMinutes();
  if (av.to > av.from) return !!av.days[wd] && m >= av.from && m < av.to;
  return (!!av.days[wd] && m >= av.from) || (!!av.days[(wd + 6) % 7] && m < av.to);
}
function availEditor(path, av, idp) {
  const opts = sel => Array.from({ length: 48 }, (_, i) => i * 30).map(m => `<option value="${m}" ${sel === m ? 'selected' : ''}>${fmtMin(m)}</option>`).join('');
  return `<div class="col" style="gap:8px">
    <div class="row" style="gap:6px;flex-wrap:wrap">${DAYS3.map((d, k) => `<button type="button" class="chip" style="min-width:46px" data-act="availDay" data-arg="${path}|${k}" aria-pressed="${!!av.days[k]}">${d}</button>`).join('')}</div>
    <div class="row" style="gap:8px"><label class="field grow">From<select id="${idp}-from" class="select" data-bind="${path}.from" data-type="num">${opts(av.from)}</select></label><label class="field grow">To<select id="${idp}-to" class="select" data-bind="${path}.to" data-type="num">${opts(av.to)}</select></label></div>
    <span class="tiny muted">${availText(av)}. Night hours are fine: choose an end time earlier than the start for shifts past midnight.</span></div>`;
}
const peso = (n, d = 0) => '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = n => Math.round(n) + '%';
const mmss = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const haversine = (a, b) => {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2;

}
function openFromToast(pane, bid) {

function listEntries(cat, filter, q) {
  let out = S.providers.filter(p => p.active !== false && (!cat || p.cat === cat)).map(p => ({ kind: 'p', o: p, d: distTo(p) }));
  S.businesses.filter(b => !cat || b.cat === cat).forEach(b => out.push({ kind: 'b', o: b, d: distTo(b) }));
  if (q) { const s = q.toLowerCase(); out = out.filter(e => e.o.name.toLowerCase().includes(s) || e.o.services.some(x => x.name.toLowerCase().includes(s)) || catName(e.o.cat).toLowerCase().includes(s)); }
  if (filter === 'ind') out = out.filter(e => e.kind === 'p' && e.o.type === 'individual');
  if (filter === 'biz') out = out.filter(e => e.kind === 'b' || e.o.type === 'staff');
  if (filter === 'now') out = out.filter(e => e.kind === 'b' ? bizGreen(e.o) > 0 : e.o.status === 'green');
  if (filter === 'top') out = out.filter(e => e.o.rating >= 4.8);
  const rank = e => e.kind === 'b' ? (bizGreen(e.o) ? 0 : 1) : ({ green: 0, yellow: 1, red: 2 })[e.o.status];
  return out.sort((a, b) => rank(a) - rank(b) || a.d - b.d);
}

function mapSvg(b, p) {

  if (b.status === 'departed') prog = Math.min(0.92, (now() - b.departedAt) / Math.max(MIN, b.promisedAt - b.departedAt));

  const pts = [c, p];
  const minLa = Math.min(...pts.map(x => x.lat)), maxLa = Math.max(...pts.map(x => x.lat)), minLo = Math.min(...pts.map(x => x.lng)), maxLo = Math.max(...pts.map(x => x.lng));

  const streets = [30, 70, 110, 150].map(y => `<path d="M0 ${y} L${W} ${y - 18}" stroke="var(--line-2)" stroke-width="5" fill="none" opacity=".6"/>`).join('') + [60, 150, 240, 300].map(x => `<path d="M${x} 0 L${x + 22} ${H}" stroke="var(--line-2)" stroke-width="5" fill="none" opacity=".6"/>`).join('');
  return `<div class="map"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Live map: provider position and your address">

function periodStart(cycle, ref) { const d = new Date(ref || now()); d.setHours(0, 0, 0, 0); if (cycle === 'weekly') d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); else if (cycle === 'monthly') d.setDate(1); else d.setDate(d.getDate() <= 15 ? 1 : 16); return d.getTime(); }
function periodEnd(cycle, start) { const s = new Date(start); return cycle === 'weekly' ? start + 7 * DAY : cycle === 'monthly' ? new Date(s.getFullYear(), s.getMonth() + 1, 1).getTime() : (s.getDate() === 1 ? new Date(s.getFullYear(), s.getMonth(), 16).getTime() : new Date(s.getFullYear(), s.getMonth() + 1, 1).getTime()); }
function bizPeriods(b, count = 4) {
  const out = []; let start = periodStart(b.cycle);
  for (let k = 0; k < count; k++) {
    const end = periodEnd(b.cycle, start);
    const rows = S.bookings.filter(x => x.bizId === b.id && x.ledger && x.endedAt >= start && x.endedAt < end);
    const sum = key => rows.reduce((a, x) => a + (key === 'gross' ? x.gross : x.ledger[key]), 0);
    out.push({ start, end, rows, gross: sum('gross'), fee: sum('fee'), wht: sum('wht'), net: sum('net'), current: k === 0, paid: k > 0 || rows.every(x => x.ledger.paidAt) && rows.length > 0 });
    start = periodStart(b.cycle, start - DAY);
  }
  return out;
}

  const cyc = c => `<button data-act="setCycle" data-arg="${c}" aria-pressed="${b.cycle === c}">${{ weekly: 'Weekly', biweekly: 'Twice a month', monthly: 'Monthly' }[c]}</button>`;
  return `<div class="page-h"><div><h1>Settlement</h1><p>Staff job payouts are paid to the business account, not to staff, on the cycle you choose. BalikHome deducts only its platform fee and any tax withheld.</p></div><div class="seg">${cyc('weekly')}${cyc('biweekly')}${cyc('monthly')}</div></div>

function jobMatches(b) {
  const f = S.admin.jobFilter || 'all', q = (S.admin.jobQ || '').trim().toLowerCase();
  const groups = { open: ['requested', 'business_queue', 'offered', 'paid', 'departed', 'arrived'], done: ['ended', 'reviewed'], failed: ['declined', 'no_response', 'expired', 'cancelled'] };
  if (f !== 'all' && f !== 'late' && !groups[f].includes(b.status)) return false;
  if (f === 'late' && !b.late) return false;
  if (!q) return true;
  const p = b.pid ? prov(b.pid) : null;
  return [b.id, b.customer, p ? p.name : '', b.bizId ? biz(b.bizId).name : '', b.services.map(s => s.name).join(' ')].join(' ').toLowerCase().includes(q);
}

    </tbody></table></div></div>
    <div class="narrow panel"><div class="panel-h"><h3>${sel ? sel.id : 'Select a job'}</h3>${sel ? statusPill(sel.status) : ''}</div><div class="panel-b">${sel ? `<span class="small muted">${esc(sel.customer)} · ${esc(sel.services.map(s => s.name).join(' + '))} · ${peso(sel.gross)}</span>

/* =============== Live maps (Leaflet + CARTO/OSM tiles, SVG fallback) and check-in camera =============== */
const KEEP = {};      // DOM nodes that must survive re-renders (maps, camera)
const ROUTES = {};    // booking id -> road route [[lat, lng], ...]
const hasLeaflet = () => typeof window.L !== 'undefined' && !!window.L.map;
function alongRoute(pts, f) {
  if (pts.length < 2) return pts[0];
  const seg = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); tot += d; }
  let goal = tot * f;
  for (let i = 0; i < seg.length; i++) { if (goal <= seg[i]) { const t = seg[i] ? goal / seg[i] : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; } goal -= seg[i]; }
  return pts[pts.length - 1];
}
function provPos(b, p) {
  const dest = [b.lat, b.lng], base = [p.lat, p.lng];
  if (['arrived', 'ended', 'reviewed'].includes(b.status)) return { pos: dest, live: false };
  if (b.live && b.status === 'departed' && Date.now() - b.live.t < 90000) return { pos: [b.live.lat, b.live.lng], live: true };
  if (b.status !== 'departed') return { pos: base, live: false };
  const f = Math.min(0.97, Math.max(0, (now() - b.departedAt) / Math.max(MIN, b.promisedAt - b.departedAt)));
  return { pos: alongRoute(ROUTES[b.id] || [base, dest], f), live: false };
}
function fetchRoute(b, p) {
  if (ROUTES[b.id] || ROUTES['_' + b.id]) return; ROUTES['_' + b.id] = 1;
  try {
    fetch(`https://router.project-osrm.org/route/v1/driving/${p.lng},${p.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`)
      .then(r => r.json()).then(j => { const r = j && j.routes && j.routes[0]; if (r) { ROUTES[b.id] = r.geometry.coordinates.map(([x, y]) => [y, x]); updateMaps(true); } }).catch(() => { });
  } catch (e) { }
}
// who: 'c' (customer sees the provider coming) or 'p' (provider sees where to go)
function liveMap(b, p, who) {

  return `<div class="card tight lmapcard" style="gap:10px"><div data-keep="map|${who}|${b.id}" class="lmap"></div>${info}</div>`;
}
const pinIcon = () => L.divIcon({ className: 'mk', iconSize: [34, 42], iconAnchor: [17, 40], html: `<svg width="34" height="42" viewBox="0 0 34 42"><path d="M17 41C17 41 32 26 32 16A15 15 0 0 0 2 16C2 26 17 41 17 41Z" fill="#12355B" stroke="#fff" stroke-width="2.5"/><path d="M10.5 18.5 17 12.5l6.5 6v6.5h-13Z" fill="#F4B740"/></svg>` });
const provIcon = p => { const src = photoOf(p); return L.divIcon({ className: 'mk', iconSize: [46, 46], iconAnchor: [23, 23], html: `<span class="mkp">${src ? `<img src="${src}" alt="">` : esc(p.name[0])}</span>` }); };
function makeKeep(k) {
  const [kind, who, bid] = k.split('|');
  if (kind === 'map') {
    const el = document.createElement('div'); el.className = 'lmap';
    return { el, kind, who, bid, init() {
      const b = bk(bid), p = b && prov(b.pid); if (!b || !p) return;
      const m = L.map(el, { zoomControl: false, attributionControl: true, scrollWheelZoom: false });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd', attribution: '© OpenStreetMap contributors © CARTO' }).addTo(m);
      m.attributionControl.setPrefix(false); L.control.zoom({ position: 'topright' }).addTo(m);

  const fid = ae && ae.id;

function planReminders(b) {
  if (b.when !== 'later' || !b.slotAt) { b.reminders = []; return; }
  const base = b.createdAt || now(), svc = b.slotAt, list = [];
  const add = (key, at, label) => { if (at > now() && at < svc - 30 * MIN && !list.some(r => Math.abs(r.at - at) < 30 * MIN)) list.push({ key, at, label, sent: false }); };
  add('d1', base + DAY, 'Reminder · 1 day after booking');
  add('d2', base + 2 * DAY, 'Reminder · 2 days after booking');
  const morning = dayStart(svc) + 8 * HOUR; add('day', morning > base ? morning : dayStart(svc) + 30 * MIN, 'Today is your booking day');
  list.push({ key: 'h1', at: Math.max(now() + MIN, svc - HOUR), label: 'Starts in 1 hour', sent: false });
  b.reminders = list.sort((x, y) => x.at - y.at);
  logB(b, 'Reminders set: ' + b.reminders.map(r => fmtWhen(r.at)).join(' · '));
}

function sendDueReminders(n) {
  let changed = false;

    if (!b.reminders || !b.reminders.length) return;

    b.reminders.forEach(r => {

      const p = prov(b.pid), what = b.services.map(s => s.name).join(' + '), when = fmtWhen(b.slotAt);

// Shared data lives in one "room". With a Firebase config it syncs across devices in real time;
// without one it still syncs between tabs on the same device (BroadcastChannel + localStorage).
const SHARED_LIST = ['providers', 'businesses', 'bookings', 'alerts', 'sms', 'applications'];

window.__balikSync = SYNC;

const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { } };

lsSet('balik-room', SYNC.room);

  if (window.BALIK_FIREBASE && window.BALIK_FIREBASE.databaseURL) return window.BALIK_FIREBASE;
  try { const c = JSON.parse(lsGet('balik-fb-config') || 'null'); if (c && c.databaseURL) return c; } catch (e) { }
  return null;
}
const sortFns = {
  providers: (a, b) => (parseInt(a.id.slice(1)) || 0) - (parseInt(b.id.slice(1)) || 0),
  businesses: (a, b) => a.id < b.id ? -1 : 1,
  bookings: (a, b) => b.createdAt - a.createdAt,
  alerts: (a, b) => b.at - a.at, sms: (a, b) => b.at - a.at, applications: (a, b) => (b.at || 0) - (a.at || 0)
};
function recordsOf(name) {
  const out = {};
  if (SHARED_MAP.includes(name)) Object.entries(S[name] || {}).forEach(([k, v]) => { out[k] = JSON.stringify(v); });
  else (S[name] || []).forEach(r => { if (r && r.id) out[r.id] = JSON.stringify(r); });
  return out;
}
function snapshotPaths() {
  const paths = {};
  SHARED_LIST.concat(SHARED_MAP).forEach(n => { const cur = recordsOf(n); Object.entries(cur).forEach(([k, v]) => { paths[n + '/' + k] = v; }); });
  SHARED_ONE.forEach(n => { paths[n] = JSON.stringify(S[n]); });
  return paths;
}
function markSynced() { SHARED_LIST.concat(SHARED_MAP).forEach(n => { SYNC.last[n] = recordsOf(n); }); SHARED_ONE.forEach(n => { SYNC.last[n] = JSON.stringify(S[n]); }); }
function diffPaths() {
  const paths = {};
  SHARED_LIST.concat(SHARED_MAP).forEach(n => {
    const cur = recordsOf(n), last = SYNC.last[n] || {};
    Object.keys(cur).forEach(k => { if (cur[k] !== last[k]) paths[n + '/' + k] = cur[k]; });
    Object.keys(last).forEach(k => { if (!(k in cur)) paths[n + '/' + k] = null; });
    SYNC.last[n] = cur;
  });
  SHARED_ONE.forEach(n => { const v = JSON.stringify(S[n]); if (v !== SYNC.last[n]) { paths[n] = v; SYNC.last[n] = v; } });
  return paths;
}
function pushNow() {
  if (!SYNC.adapter || !SYNC.ready) return;
  const p = diffPaths();
  if (Object.keys(p).length) SYNC.adapter.update(p).catch(e => { SYNC.status = 'Sync error: ' + (e && e.message || e); });
}

function myTargets() { return { ['customer:' + (S.customer.cid || 'me')]: 'customer', ['provider:' + S.prov.id]: 'provider', ['business:' + S.biz.id]: 'business' }; }
function applyRemote(root) {
  if (!root) return false;
  let changed = false;
  const mine = myTargets();
  const myPhone = (prov(S.prov.id) || {}).phone;
  SHARED_LIST.concat(SHARED_MAP).forEach(n => {
    const remote = root[n] || {}, last = SYNC.last[n] || {}, local = recordsOf(n);
    const keys = new Set(Object.keys(remote).concat(Object.keys(local)));
    let differs = false; const merged = {};
    keys.forEach(k => {
      const localChanged = local[k] !== last[k];       // edited here and not pushed yet
      const v = localChanged ? local[k] : remote[k];
      if (v != null) merged[k] = v;
      if (v !== local[k]) differs = true;
      if (!localChanged && remote[k] != null && last[k] == null && local[k] == null) {   // brand-new record from another device
        try {
          const r = JSON.parse(remote[k]);
          if (n === 'alerts' && mine[r.to] && SYNC.ready) toast(mine[r.to], r.title, r.body, false, r.bid || null);
          if (n === 'sms' && SYNC.ready) { if (r.to === myPhone) toast('provider', 'SMS · BalikHome', r.text, true); if (r.kind === 'late') toast('admin', 'SMS · Late arrival', r.text, true); }
        } catch (e) { }
      }
    });
    SYNC.last[n] = Object.assign({}, remote);
    if (differs) {
      changed = true;
      const vals = Object.entries(merged).map(([k, v]) => { try { return [k, JSON.parse(v)]; } catch (e) { return null; } }).filter(Boolean);
      if (SHARED_MAP.includes(n)) S[n] = Object.fromEntries(vals);
      else S[n] = vals.map(x => x[1]).sort(sortFns[n]);
    }
  });
  SHARED_ONE.forEach(n => {
    const remote = root[n]; if (remote == null) return;
    const localChanged = JSON.stringify(S[n]) !== SYNC.last[n];
    if (!localChanged && remote !== SYNC.last[n]) { try { S[n] = JSON.parse(remote); changed = true; } catch (e) { } }
    if (!localChanged) SYNC.last[n] = remote;
  });
  if (root.meta && typeof root.meta.skip === 'number' && root.meta.skip !== skip) { skip = root.meta.skip; changed = true; }

}

async function firebaseAdapter(cfg, room) {
  const V = '10.14.1';
  if (!window.firebase) { await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`); await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-database-compat.js`); }
  const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
  const ref = app.database().ref('rooms/' + room);
  ref.child('presence/' + DEVICE).onDisconnect().remove();
  return {
    kind: 'firebase',
    get: () => ref.get().then(s => s.val()),
    onChange: f => ref.on('value', s => f(s.val())),
    update: paths => ref.update(paths),
    reset: () => ref.remove()
  };
}
async function startSync() {
  const cfg = fbConfig();
  try {
    if (cfg) { SYNC.status = 'Connecting to Firebase…'; render(); SYNC.adapter = await firebaseAdapter(cfg, SYNC.room); SYNC.mode = 'live'; }
    else { SYNC.adapter = localAdapter(SYNC.room); SYNC.mode = 'tabs'; }
  } catch (e) { SYNC.adapter = localAdapter(SYNC.room); SYNC.mode = 'tabs'; SYNC.cfgErr = String(e && e.message || e); }
  try {
    if (lsGet('balik-reseed') === '1') { lsSet('balik-reseed', null); await SYNC.adapter.reset(); }
    const root = await SYNC.adapter.get();
    if (!root || !root.meta) {
      await SYNC.adapter.update(Object.assign(snapshotPaths(), { 'meta/skip': skip, 'meta/createdAt': Date.now(), 'meta/by': DEVICE }));
      markSynced();
    } else {
      SHARED_LIST.concat(SHARED_MAP).forEach(n => { SYNC.last[n] = {}; });
      SHARED_ONE.forEach(n => { SYNC.last[n] = JSON.stringify(S[n]); });
      // take the room's data as the truth for shared records
      SHARED_LIST.forEach(n => { S[n] = []; }); SHARED_MAP.forEach(n => { S[n] = {}; });
      SHARED_LIST.concat(SHARED_MAP).forEach(n => { SYNC.last[n] = {}; });
      applyRemote(root);
      SHARED_ONE.forEach(n => { if (root[n]) { try { S[n] = JSON.parse(root[n]); SYNC.last[n] = root[n]; } catch (e) { } } });
    }
    if (!S.customers[S.customer.cid || 'me'] && S.customer.signedIn) S.customers[S.customer.cid || 'me'] = custRecordFromLocal();
    SYNC.ready = true;
    SYNC.status = SYNC.mode === 'live' ? 'Live' : 'This device only';
    SYNC.adapter.onChange(r => { if (applyRemote(r)) render(); });
    const beat = () => SYNC.adapter.update({ ['presence/' + DEVICE]: Date.now() }).catch(() => { });
    beat(); setInterval(beat, 10000);
    pushNow(); render();
  } catch (e) { SYNC.status = 'Offline: ' + (e && e.message || e); SYNC.adapter = null; render(); }
}
function custRecordFromLocal() { const c = S.customer; return { cid: c.cid || 'me', name: c.name, email: c.email, phone: c.phone, addr: c.addr, idOk: !!c.idOk, suspended: false, createdAt: now() }; }
const myCust = () => S.customers[S.customer.cid || 'me'] || {};
function uniqueId(prefix, exists) { let id; do { id = prefix + (2000 + Math.floor(Math.random() * 7999)); } while (exists(id)); return id; }

load();
S.prov.cam = null; S.prov.camShot = null;
if (!S.loc) S.loc = { status: 'unknown', asked: false, shareProv: true, here: null, ask: false };
S.prov.gps = S.loc.status === 'granted' && S.loc.shareProv; S.loc.ask = false;
locInit();
if (!S.customers) S.customers = { me: { cid: 'me', name: ME, email: 'maria.santos@example.com', phone: '+63 917 555 0142', addr: 'home', idOk: false, suspended: false, createdAt: simStart - 40 * DAY } };
if (!S.customer.cid) S.customer.cid = 'me';
let lastTick = now();
function tick(force = false) {
  const n = now(), dt = Math.max(0, n - lastTick); lastTick = n; let changed = force;
  const lead = isLeader();
  if (lead) { const wk = weekKeyOf(n); if (CR().lastWeek && CR().lastWeek !== wk) { closeWeekAll(CR().lastWeek); changed = true; } if (CR().lastWeek !== wk) { CR().lastWeek = wk; } }
  if (lead) S.providers.forEach(p => { if (p.status === 'green') p.greenToday += dt / HOUR; if (p.status === 'yellow' && p.backAt && n >= p.backAt) { p.status = 'green'; p.backAt = null; changed = true; if (S.prov.id === p.id) toast('provider', "You're back on green", 'Your away time ended.'); } });
  if (lead && sendDueReminders(n)) changed = true;
  if (lead) S.bookings.forEach(b => {
    if (b.status === 'requested' && n > b.respondBy) { b.status = 'no_response'; logB(b, 'No response in time'); changed = true;
      if (b.cid) { pushAlert('customer', `${prov(b.pid).name.split(' ')[0]} didn't reply in time`, 'You were not charged.', b.id, 'bad'); toast('customer', 'No reply in time', 'You were not charged. Try someone nearby.'); } }
    if (b.status === 'offered' && n > b.offerExpires) { b.status = 'expired'; logB(b, 'Customer did not confirm in time'); changed = true; pushAlert('provider:' + b.pid, 'Offer expired', b.id + ' · the customer did not confirm.', b.id); }
    if (['paid', 'departed'].includes(b.status) && !b.arrivedAt && b.promisedAt && n > b.promisedAt + S.settings.lateTrigger * MIN && !b.late) {
      const p = prov(b.pid);
      b.late = { at: n, penalty: false, replies: [], resolved: false, seen: false }; changed = true;
      const text = `[LATE] ${b.id} not arrived. ${p.name}${p.biz ? ' (' + biz(p.biz).name + ')' : ''}. Promised ${fmtT(b.promisedAt)}, now ${fmtT(n)}. ${b.address.split(',').slice(-2).join(',').trim()}.`;
      sendSms(S.settings.adminNumbers, text, 'late'); logB(b, 'Late: SMS to admin, alert to provider');
      if (S.settings.alertBiz && p.biz) { pushAlert('business:' + p.biz, 'Staff running late', text, b.id, 'bad'); toast('business', 'Staff running late', p.name + ' · ' + b.id); }
      pushAlert('provider:' + p.id, "You're past your arrival time", 'Check in or send a new time.', b.id, 'bad');
      toast('admin', 'SMS · Late arrival', text, true);
      toast('provider', 'Late arrival alert', 'Promised ' + fmtT(b.promisedAt) + '. Check in or update your time.');
      if (S.settings.tellCustomer && b.cid) { pushAlert('customer', `${p.name.split(' ')[0]} is running late`, 'Our team has been alerted and is following up.', b.id); toast('customer', `${p.name.split(' ')[0]} is running late`, 'Our team is following up.'); }
    }
    if (b.late && !b.late.penalty && !b.arrivedAt && ['paid', 'departed'].includes(b.status) && n > b.promisedAt + S.settings.penaltyAfter * MIN) { b.late.penalty = true; addCredit(prov(b.pid), CR().rules.late, 'Late arrival · ' + b.id, b.id, 'late', 'late:' + b.id); logB(b, `Reward credit −1: more than ${S.settings.penaltyAfter} min late`); changed = true; }
    if (b.status === 'arrived' && n >= b.endAt) { endService(b, true); changed = true; }
  });
  const before = S.toasts.length; S.toasts = S.toasts.filter(t => t.until > Date.now()); if (S.toasts.length !== before) changed = true;
  if (changed) render();
  else {
    document.querySelectorAll('[data-clock]').forEach(el => el.textContent = fmtD(n) + ' ' + fmtT(n));
    document.querySelectorAll('[data-cd]').forEach(el => el.textContent = mmss(Number(el.dataset.cd) - n));
    updateMaps();
    document.querySelectorAll('[data-calltime]').forEach(el => el.textContent = mmss(Date.now() - Number(el.dataset.calltime)));
    if (callSync()) render();
  }
}
render();
startSync();
setInterval(() => tick(false), 1000);
})();
