<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balik Home Care</title>
<meta name="description" content="Balik Home Care — book verified beauty, massage and pet-grooming pros at home. Test build.">
<meta name="theme-color" content="#12355B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balik">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a sticky prototype bar over a stage. Customer and provider apps render as phones side by side;
   business and admin render as desktop web consoles. One shared, live data model drives every view. */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#F3F5F9; --surface-3:#E8ECF2;
  --fg:#0C1222; --fg-2:#344054; --muted:#5F6B7E; --line:#E3E6EC; --line-2:#D2D7E0;
  --accent:#12355B; --accent-hover:#0D2846; --accent-soft:#E8EEF8; --accent-ink:#FFFFFF;
  --mango:#F4B740; --mango-ink:#0D2846; --mango-soft:#FFF4DC; --info:#3551E0;
  --brand-grad:linear-gradient(160deg,#0D2846 0%,#12355B 55%,#1C4677 100%);
  --good:#0F8F4E; --good-dot:#18B263; --good-soft:#E7F6EE;
  --warn:#8A5A00; --warn-dot:#F2B300; --warn-soft:#FFF5DA;
  --bad:#C9302F; --bad-dot:#E5484D; --bad-soft:#FDEDED;
  --ink:#0C1222; --ink-fg:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06),0 1px 1px rgba(15,23,42,.03);
  --shadow-md:0 10px 28px -12px rgba(15,23,42,.22),0 2px 6px rgba(15,23,42,.05);
  --shadow-lg:0 40px 80px -30px rgba(15,23,42,.38),0 8px 24px -8px rgba(15,23,42,.12);
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r-sm:8px; --r:12px; --r-lg:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08090D; --surface:#111319; --surface-2:#161922; --surface-3:#1E222D;
  --fg:#EEF1F6; --fg-2:#C4CAD6; --muted:#8E97A8; --line:#232733; --line-2:#2F3441;
  --accent:#8DB0E6; --accent-hover:#A9C4EE; --accent-soft:#15233A; --accent-ink:#081428;
  --mango:#F4B740; --mango-ink:#0D2846; --mango-soft:#2A220C; --info:#8EA0FF;
  --good:#45D48C; --good-dot:#2FCB7A; --good-soft:#0E271B;
  --warn:#F6C752; --warn-dot:#F2B300; --warn-soft:#2A220C;
  --bad:#FF7A7C; --bad-dot:#F05A5E; --bad-soft:#2D1415;
  --ink:#EEF1F6; --ink-fg:#0C1222;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 12px 30px -12px rgba(0,0,0,.6); --shadow-lg:0 40px 80px -30px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08090D; --surface:#111319; --surface-2:#161922; --surface-3:#1E222D;
  --fg:#EEF1F6; --fg-2:#C4CAD6; --muted:#8E97A8; --line:#232733; --line-2:#2F3441;
  --accent:#8DB0E6; --accent-hover:#A9C4EE; --accent-soft:#15233A; --accent-ink:#081428;
  --mango:#F4B740; --mango-ink:#0D2846; --mango-soft:#2A220C; --info:#8EA0FF;
  --good:#45D48C; --good-dot:#2FCB7A; --good-soft:#0E271B;
  --warn:#F6C752; --warn-dot:#F2B300; --warn-soft:#2A220C;
  --bad:#FF7A7C; --bad-dot:#F05A5E; --bad-soft:#2D1415;
  --ink:#EEF1F6; --ink-fg:#0C1222;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 12px 30px -12px rgba(0,0,0,.6); --shadow-lg:0 40px 80px -30px rgba(0,0,0,.8);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
.ic{flex-shrink:0;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Prototype bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--mango);color:var(--mango-ink);display:grid;place-items:center}
.brand small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-3);overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.clock{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--muted)}
.clock .num{color:var(--fg);font-weight:600}
.mini{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--fg-2)}
.mini:hover{border-color:var(--muted)}

/* ---------- Stage ---------- */
.stage{max-width:1440px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.duo{display:flex;flex-wrap:wrap;justify-content:center;gap:32px 48px}
.duo-col{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.duo-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.intro{max-width:880px;margin:0 auto 24px;text-align:center;display:flex;flex-direction:column;gap:6px}
.intro h1{font-size:22px}
.intro p{color:var(--muted);font-size:14px}

/* ---------- Phone device ---------- */
.device{width:min(400px,100%);height:min(840px,calc(100dvh - 140px));min-height:640px;border-radius:40px;background:var(--surface);box-shadow:var(--shadow-lg);border:1px solid var(--line);padding:10px;position:relative}
.screen{position:relative;height:100%;border-radius:31px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
@media (max-width:640px){
  .device{width:100%;height:calc(100dvh - 120px);min-height:560px;border-radius:24px;padding:0;border:0;box-shadow:none}
  .screen{border-radius:20px}
}
.appbar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;min-height:58px}
.appbar h2{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg);position:relative;flex-shrink:0}
.iconbtn:hover{background:var(--surface-2)}
.badge-n{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad-dot);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.scroll{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0;padding-bottom:4px}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;font-size:10.5px;font-weight:500;color:var(--muted);position:relative}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .badge-n{top:3px;right:calc(50% - 20px)}
.footer-bar{background:var(--surface);border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}

/* ---------- Primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.flat{box-shadow:none}
.card.tight{padding:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-h h3{font-size:15px;font-weight:600}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.divider{height:1px;background:var(--line);margin:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:15px;text-decoration:none;transition:background .15s,transform .05s}
.btn:active{transform:scale(.985)}
.btn.block{width:100%}
.btn.sm{height:36px;font-size:13px;padding:0 12px;border-radius:10px}
.btn.xs{height:30px;font-size:12px;padding:0 10px;border-radius:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ink{background:var(--ink);color:var(--ink-fg)}
.btn.mango{background:var(--mango);color:var(--mango-ink)}
.btn.mango:hover{filter:brightness(1.04)}
.btn.secondary{background:var(--surface);border-color:var(--line-2);color:var(--fg)}
.btn.secondary:hover{border-color:var(--muted)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--surface);border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.btn.good{background:var(--good-dot);color:#04170D}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--fg-2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.outline{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.green{background:var(--good-dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--good-dot) 22%,transparent)}
.dot.yellow{background:var(--warn-dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn-dot) 22%,transparent)}
.dot.red{background:var(--bad-dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad-dot) 22%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:500;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--fg-2)}
.input,.select,.textarea{width:100%;height:44px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;font-size:15px;color:var(--fg)}
.textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.check{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--fg-2);line-height:1.4}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex-shrink:0}
.progress{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.progress>span{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .4s}
.progress.good>span{background:var(--good-dot)}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:600;flex-shrink:0;letter-spacing:-.02em}
.photo{border-radius:10px;position:relative;overflow:hidden;background-size:cover;background-position:center}
.photo .ic{position:absolute;inset:auto 6px 6px auto;color:#fff;opacity:.85}
.stars{color:#E8A400;letter-spacing:1px}
.stars .off{color:var(--line-2)}

/* list rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;min-width:0}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--surface-2)}

/* provider cards */
.pcard{display:flex;gap:12px;padding:12px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);text-align:left;width:100%;align-items:flex-start;transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow-md)}
.pcard .meta{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.pcard .name{font-weight:600;font-size:15px}
.pcard .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.status-line{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.status-line.green{color:var(--good)} .status-line.yellow{color:var(--warn)} .status-line.red{color:var(--bad)}
.ret{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px}

/* categories */
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cat{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--fg-2);padding:4px 0}
.cat span.tile{width:56px;height:56px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg);transition:transform .15s}
.cat:nth-child(1) span.tile{background:#FDE7EC;color:#A3334F;border-color:transparent}.cat:nth-child(2) span.tile{background:#FFF1D6;color:#8A5A00;border-color:transparent}.cat:nth-child(3) span.tile{background:#E5F4EC;color:#2B6B48;border-color:transparent}.cat:nth-child(4) span.tile{background:#E8EEF8;color:#12355B;border-color:transparent}.cat:nth-child(5) span.tile{background:#F1E8FB;color:#5B3B8C;border-color:transparent}
.cat:hover span.tile{transform:translateY(-2px);box-shadow:var(--shadow-md)}

/* hero banner */
.mission{border-radius:var(--r-lg);padding:16px;background:linear-gradient(135deg,#12355B,#2B5C93);color:#fff;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.mission h3{font-size:17px;line-height:1.25}
.mission p{font-size:13px;opacity:.78}
.mission::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:24px solid rgba(244,183,64,.35)}

/* stepper */
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.steps li{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:10.5px;font-weight:600;color:var(--muted)}
.steps li span{height:5px;border-radius:3px;background:var(--surface-3)}
.steps li.done{color:var(--fg)} .steps li.done span{background:var(--accent)}
.steps li.now{color:var(--accent)} .steps li.now span{background:linear-gradient(90deg,var(--accent) 50%,var(--surface-3) 50%)}
ol.steps{margin:0;padding:0}

/* sheets & toasts */
.overlay{position:absolute;inset:0;background:rgba(8,10,16,.42);z-index:20;display:flex;align-items:flex-end;animation:fade .18s}
.sheet{width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px 18px;display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 4px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toasts{position:absolute;top:8px;left:8px;right:8px;z-index:30;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{pointer-events:auto;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow-md);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;animation:drop .3s cubic-bezier(.2,.8,.2,1)}
.toast .app{width:28px;height:28px;border-radius:8px;background:var(--mango);color:var(--mango-ink);display:grid;place-items:center;flex-shrink:0}
.toast .app.sms{background:var(--good-dot);color:#04170D}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* traffic light */
.tlight{width:66px;padding:10px 0;border-radius:18px;background:#1B1F27;display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0}
.tlight i{width:40px;height:40px;border-radius:50%;background:#3A404C;display:block;transition:background .2s,box-shadow .2s}
.tlight i.on.g{background:#2FCB7A;box-shadow:0 0 18px #2FCB7A99}
.tlight i.on.y{background:#F2B300;box-shadow:0 0 18px #F2B30099}
.tlight i.on.r{background:#F05A5E;box-shadow:0 0 18px #F05A5E99}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* bars */
.wbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:84px;position:relative}
.wbars .b{border-radius:5px 5px 2px 2px;background:var(--surface-3);min-height:3px;position:relative}
.wbars .b.met{background:var(--good-dot)}
.wbars .b.part{background:color-mix(in srgb,var(--good-dot) 45%,var(--surface-3))}
.wbars .b.today{outline:2px solid var(--accent);outline-offset:2px}
.wbars .line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted)}
.wlabels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;font-size:10.5px;color:var(--muted);text-align:center}

/* map */
.map{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.map svg{display:block;width:100%;height:auto}

/* sms bubble */
.sms{align-self:flex-start;max-width:88%;background:var(--surface-3);border-radius:18px 18px 18px 6px;padding:10px 12px;font-size:13px}

/* ---------- Web console ---------- */

let seq = 1040;
function newBooking(o) {
  const b = Object.assign({ id: 'B-' + (++seq), customer: S.customer.name, cid: 'me', address: addr().line, lat: addr().lat, lng: addr().lng, log: [], late: null, review: null, ledger: null, createdAt: now(), when: 'now', slotAt: null }, o);
  S.bookings.unshift(b);
  return b;
}
const logB = (b, text, t = now()) => b.log.push({ t, text });
function postLedger(b) {
  const p = prov(b.pid), payee = payeeOf(b);
  const rate = tierRate(p);
  const fee = Math.round(b.gross * rate) / 100;
  const before = payee.ytd || 0;
  const applies = before + b.gross > S.settings.whtThreshold;
  const wht = applies ? Math.round(b.gross * (S.settings.whtBase / 100) * (S.settings.whtRate / 100) * 100) / 100 : 0;
  payee.ytd = before + b.gross;
  b.ledger = { rate, fee, wht, applies, net: Math.round((b.gross - fee - wht) * 100) / 100, payee: b.bizId ? 'business' : 'provider', payeeName: payee.name, payeeTin: payee.tin, at: b.endedAt };
}

function seedHistory() {
  const rows = [
    ['p2', 2, 1, 'Bea L.', 5], ['p4', 0, 1, 'Isabel R.', 5], ['p1', 0, 2, 'Jasmine T.', 5], ['p7', 0, 2, 'Kat V.', 5], ['p5', 0, 3, 'Mina S.', 5],
    ['p1', 1, 4, ME, 5], ['p3', 1, 5, 'Ramon D.', 5], ['p4', 2, 6, 'Lea G.', 5], ['p6', 0, 7, 'Pia N.', 4], ['p8', 2, 8, 'Joy A.', 5],
    ['p2', 0, 9, ME, 5], ['p1', 2, 10, 'Ella P.', 4], ['p5', 1, 11, 'Rina K.', 5], ['p7', 1, 12, 'Dan O.', 5], ['p4', 1, 13, 'Ces Y.', 5]
  ];
  rows.reverse().forEach(([pid, si, daysAgo, cust, stars]) => {
    const p = prov(pid), s = p.services[si];
    const t0 = simStart - daysAgo * DAY - 2 * HOUR;
    const eta = [20, 30, 40][daysAgo % 3];
    const lateMin = pid === 'p6' ? 26 : (daysAgo % 4 === 0 ? 6 : -4);
    const b = newBooking({ customer: cust, cid: cust === ME ? 'me' : null, pid, bizId: p.biz, services: [s], gross: s.price, mins: s.mins, status: 'reviewed', createdAt: t0, eta,
      acceptedAt: t0 + 2 * MIN, paidAt: t0 + 4 * MIN });
    b.promisedAt = b.paidAt + eta * MIN; b.departedAt = b.paidAt + 3 * MIN; b.arrivedAt = b.promisedAt + lateMin * MIN;
    b.endAt = b.arrivedAt + s.mins * MIN; b.endedAt = b.endAt; b.review = { stars, text: '', tags: [] };
    if (lateMin > S.settings.penaltyAfter) b.late = { at: b.promisedAt, penalty: true, replies: [], resolved: true };
    ['Request sent (app + SMS)', 'Accepted · ETA ' + eta + ' min', 'Customer paid', 'Departed', 'Arrived', 'Service ended', 'Customer rated ' + stars + '★'].forEach((txt, i) => logB(b, txt, [b.createdAt, b.acceptedAt, b.paidAt, b.departedAt, b.arrivedAt, b.endedAt, b.endedAt + 5 * MIN][i]));
    postLedger(b);
  });
}

  let out = S.providers.filter(p => !cat || p.cat === cat).map(p => ({ kind: 'p', o: p, d: distTo(p) }));
  S.businesses.filter(b => !cat || b.cat === cat).forEach(b => out.push({ kind: 'b', o: b, d: distTo(b) }));
  if (q) { const s = q.toLowerCase(); out = out.filter(e => e.o.name.toLowerCase().includes(s) || e.o.services.some(x => x.name.toLowerCase().includes(s)) || catName(e.o.cat).toLowerCase().includes(s)); }
  if (filter === 'ind') out = out.filter(e => e.kind === 'p' && e.o.type === 'individual');
  if (filter === 'biz') out = out.filter(e => e.kind === 'b' || e.o.type === 'staff');
  if (filter === 'now') out = out.filter(e => e.kind === 'b' ? bizGreen(e.o) > 0 : e.o.status === 'green');
  if (filter === 'top') out = out.filter(e => e.o.rating >= 4.8);
  const rank = e => e.kind === 'b' ? (bizGreen(e.o) ? 0 : 1) : ({ green: 0, yellow: 1, red: 2 })[e.o.status];
  return out.sort((a, b) => rank(a) - rank(b) || a.d - b.d);

function mapSvg(b, p) {
  const c = { lat: b.lat, lng: b.lng };
  let prog = 0;
  if (b.status === 'departed') prog = Math.min(0.92, (now() - b.departedAt) / Math.max(MIN, b.promisedAt - b.departedAt));
  if (b.status === 'arrived') prog = 1;
  const pos = { lat: p.lat + (c.lat - p.lat) * prog, lng: p.lng + (c.lng - p.lng) * prog };
  const pts = [c, p];
  const minLa = Math.min(...pts.map(x => x.lat)), maxLa = Math.max(...pts.map(x => x.lat)), minLo = Math.min(...pts.map(x => x.lng)), maxLo = Math.max(...pts.map(x => x.lng));
  const W = 340, H = 170, pad = 34;
  const sx = lo => pad + (lo - minLo) / Math.max(1e-6, maxLo - minLo) * (W - 2 * pad);
  const sy = la => H - pad - (la - minLa) / Math.max(1e-6, maxLa - minLa) * (H - 2 * pad);
  const streets = [30, 70, 110, 150].map(y => `<path d="M0 ${y} L${W} ${y - 18}" stroke="var(--line-2)" stroke-width="5" fill="none" opacity=".6"/>`).join('') + [60, 150, 240, 300].map(x => `<path d="M${x} 0 L${x + 22} ${H}" stroke="var(--line-2)" stroke-width="5" fill="none" opacity=".6"/>`).join('');
  return `<div class="map"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Live map: provider position and your address">
    <rect width="${W}" height="${H}" fill="var(--surface-2)"/>${streets}
    <path d="M${sx(p.lng)} ${sy(p.lat)} L${sx(c.lng)} ${sy(c.lat)}" stroke="var(--accent)" stroke-width="3" stroke-dasharray="6 6" fill="none" stroke-linecap="round"/>
    <circle cx="${sx(c.lng)}" cy="${sy(c.lat)}" r="9" fill="var(--ink)"/><circle cx="${sx(c.lng)}" cy="${sy(c.lat)}" r="3.5" fill="var(--surface)"/>
    <circle cx="${sx(pos.lng)}" cy="${sy(pos.lat)}" r="12" fill="var(--accent)" opacity=".18"/><circle cx="${sx(pos.lng)}" cy="${sy(pos.lat)}" r="7" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5"/>
  </svg></div>`;
}

function periodStart(cycle) { const d = new Date(now()); d.setHours(0, 0, 0, 0); if (cycle === 'weekly') d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); else if (cycle === 'monthly') d.setDate(1); else d.setDate(d.getDate() <= 15 ? 1 : 16); return d.getTime(); }

function sendRequest() {
  const c = S.cust, { src, svcs, gross, mins } = cartInfo(), isBiz = c.screenSrc === 'biz';
  const b = newBooking({ pid: isBiz ? null : src.id, bizId: isBiz ? src.id : (src.biz || null), services: svcs.map(s => ({ ...s })), gross, mins, status: isBiz ? 'business_queue' : 'requested', when: c.when, slotAt: c.when === 'later' ? c.slot : null, respondBy: now() + S.settings.respond * MIN });

  if (isBiz) {

    toast('business', 'New request · assign a therapist', `${svcs.map(s => s.name).join(' + ')} · ${peso(gross)}`);
    logB(b, 'Business alerted to assign staff');
  } else notifyProviderOfRequest(b, src);
  c.bid = b.id; c.cart = []; c.screen = 'request';

  sendSms(p.phone, `Balik: New booking request, ${b.services[0].name}. Accept or decline: balik.ph/r/${b.id.slice(2)}`);
  toast('provider', 'Balik · New request', `${b.services.map(s => s.name).join(' + ')} · ${fmtKm(haversine(p, b))} away`);
  toast('provider', 'SMS · Balik', 'New booking request. Accept or decline: balik.ph/r/' + b.id.slice(2), true);

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.file) {
    const f = el.files && el.files[0]; if (!f) return;
    const put = url => { const cur = getPath(el.dataset.file); if (Array.isArray(cur)) cur.push(url); else setPath(el.dataset.file, url); render(); };
    const rd = new FileReader(); rd.onload = () => {
      if (!el.dataset.compress) return put(rd.result);
      const img = new Image(); img.onload = () => { const m = 480, sc = Math.min(1, m / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); const side = Math.min(img.width, img.height);
        cv.width = cv.height = Math.round(Math.min(m, side)); const g = cv.getContext('2d'); g.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, cv.width, cv.height); put(cv.toDataURL('image/jpeg', .85)); };

/* =============== Clock / automation =============== */
load();
let lastTick = now();
function tick(force = false) {
  const n = now(), dt = Math.max(0, n - lastTick); lastTick = n; let changed = force;
  S.providers.forEach(p => { if (p.status === 'green') p.greenToday += dt / HOUR; if (p.status === 'yellow' && p.backAt && n >= p.backAt) { p.status = 'green'; p.backAt = null; changed = true; if (S.prov.id === p.id) toast('provider', "You're back on green", 'Your away time ended.'); } });
  S.bookings.forEach(b => {
    if (b.status === 'requested' && n > b.respondBy) { b.status = 'no_response'; logB(b, 'No response in time'); changed = true;
      if (b.cid === 'me') { pushAlert('customer', `${prov(b.pid).name.split(' ')[0]} didn't reply in time`, 'You were not charged.', b.id, 'bad'); toast('customer', 'No reply in time', 'You were not charged. Try someone nearby.'); } }
    if (b.status === 'offered' && n > b.offerExpires) { b.status = 'expired'; logB(b, 'Customer did not confirm in time'); changed = true; pushAlert('provider:' + b.pid, 'Offer expired', b.id + ' · the customer did not confirm.', b.id); }
    if (['paid', 'departed'].includes(b.status) && !b.arrivedAt && b.promisedAt && n > b.promisedAt + S.settings.lateTrigger * MIN && !b.late) {
      const p = prov(b.pid);
      b.late = { at: n, penalty: false, replies: [], resolved: false, seen: false }; changed = true;
      const text = `[LATE] ${b.id} not arrived. ${p.name}${p.biz ? ' (' + biz(p.biz).name + ')' : ''}. Promised ${fmtT(b.promisedAt)}, now ${fmtT(n)}. ${b.address.split(',').slice(-2).join(',').trim()}.`;
      sendSms(S.settings.adminNumbers, text, 'late'); logB(b, 'Late: SMS to admin, alert to provider');
      if (S.settings.alertBiz && p.biz) { pushAlert('business:' + p.biz, 'Staff running late', text, b.id, 'bad'); toast('business', 'Staff running late', p.name + ' · ' + b.id); }
      pushAlert('provider:' + p.id, "You're past your arrival time", 'Check in or send a new time.', b.id, 'bad');
      toast('admin', 'SMS · Late arrival', text, true);
      toast('provider', 'Late arrival alert', 'Promised ' + fmtT(b.promisedAt) + '. Check in or update your time.');
      if (S.settings.tellCustomer && b.cid === 'me') { pushAlert('customer', `${p.name.split(' ')[0]} is running late`, 'Our team has been alerted and is following up.', b.id); toast('customer', `${p.name.split(' ')[0]} is running late`, 'Our team is following up.'); }
    }
    if (b.late && !b.late.penalty && !b.arrivedAt && ['paid', 'departed'].includes(b.status) && n > b.promisedAt + S.settings.penaltyAfter * MIN) { b.late.penalty = true; prov(b.pid).points++; logB(b, `Penalty point: more than ${S.settings.penaltyAfter} min late`); changed = true; }
    if (b.status === 'arrived' && n >= b.endAt) { endService(b, true); changed = true; }
  });
  const before = S.toasts.length; S.toasts = S.toasts.filter(t => t.until > Date.now()); if (S.toasts.length !== before) changed = true;
  if (changed) render();
  else {
    document.querySelectorAll('[data-clock]').forEach(el => el.textContent = fmtT(n));
    document.querySelectorAll('[data-cd]').forEach(el => el.textContent = mmss(Number(el.dataset.cd) - n));
  }
}
render();
setInterval(() => tick(false), 1000);
})();
</script>
